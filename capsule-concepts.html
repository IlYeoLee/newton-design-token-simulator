<!doctype html><html lang="ko" translate="no"><head><meta charset="utf-8"><meta name="google" content="notranslate">
<title>캡슐 언어 확장 시안 — 프리뷰 · 따라하기</title>
<!-- 시작(READY) 캡슐 언어를 프리뷰(관찰)·따라하기로 확장하는 아이디에이션.
     ★ 목업이 아니다 — 캡슐 패스·유리 림·엠버 글로우·아크 게이지·도트 롤 전부 정본(src/floorgl.js)
       부품을 그대로 불러 그린다. 여기서 고른 안을 그 자리에 이식하면 화면이 이 그림과 같다.
     비교 축: '캡슐을 어떻게 변형해 두 번째 정보(영상·판정)를 담는가'. -->
<style>
@font-face{font-family:'Supreme';src:url('/fonts/Supreme-Bold.woff2') format('woff2');font-weight:700;font-display:block}
@font-face{font-family:'Supreme';src:url('/fonts/Supreme-Medium.woff2') format('woff2');font-weight:500;font-display:block}
@font-face{font-family:'OffBit';src:url('/fonts/OffBitTrial-DotBold.woff') format('woff');font-weight:700;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#14161a;color:#E9EAEE;font:13px/1.6 -apple-system,'Malgun Gothic',sans-serif;padding:20px 22px 60px}
h1{font-size:17px;margin:0 0 4px}
.sub{color:#98A1AD;font-size:12px;margin:0 0 16px;max-width:1100px}
.seg{display:flex;gap:8px;margin:0 0 18px}
.seg button{padding:7px 15px;border:1px solid #262b35;border-radius:99px;background:#1a1e25;color:#98A1AD;
  font-size:12.5px;font-weight:600;cursor:pointer}
.seg button.on{background:#FA3030;border-color:#FA3030;color:#fff}
h2{font-size:13.5px;margin:22px 0 10px;color:#FEC389}
.row{display:flex;gap:16px;flex-wrap:wrap}
.cell{width:328px}
.cell canvas{width:328px;height:547px;display:block;border-radius:14px;background:#8B9080}
.nm{font-size:12.5px;font-weight:700;margin:9px 0 3px}
.ds{font-size:11.5px;color:#98A1AD;line-height:1.55}
</style></head><body>
<h1>캡슐 언어 확장 시안 — 프리뷰(관찰) · 따라하기</h1>
<p class="sub">시작 화면의 <b>유리 캡슐 + 엠버 글로우 + 도트 숫자 + 아크</b> 문법을 두 화면으로 넓히는 세 갈래.
정본 부품으로 실제 렌더링하며, 배경은 트랙 톤(#8B9080)으로 깔았습니다.</p>
<div class="seg" id="seg"></div>
<div id="flowbar" style="display:none;margin:0 0 14px;align-items:center;gap:12px">
  <button id="fplay" style="padding:6px 14px;border:1px solid #262b35;border-radius:99px;background:#1a1e25;color:#E9EAEE;font-size:12.5px;font-weight:600;cursor:pointer">⏸ 정지</button>
  <input id="fscrub" type="range" min="0" max="5.4" step="0.01" value="0" style="width:520px;accent-color:#FA3030">
  <span id="ftime" style="font:12px monospace;color:#98A1AD">0.00s</span>
</div>
<h2 id="ttl">프리뷰(관찰)</h2>
<div class="row" id="row"></div>
<script type="module">
const FG = await import('/src/floorgl.js');
const { arcGauge, rollNum, drawBadge, ringGauge, eOut, intro, clamp01, kf, cycle } = FG;

const W = 1600, H = 2670;                 // 지면 대지 규격(정본)
const IMG = {};
const img = rel => {
  if (IMG[rel] !== undefined) return IMG[rel];
  const im = new Image(); im.src = '/ready-view/assets/' + rel;
  im.onload = () => {}; IMG[rel] = im; return im;
};
const RF = (w, s, fam = "'Supreme',sans-serif") => `${w} ${s}px ${fam}`;
const DOT = "'OffBit',monospace";

// ── 정본 캡슐 재질 — READY(_paint_ready2)의 지오메트리·림·글로우를 그대로 ──────────
function capsule(g, x, y, w, h, o = {}) {
  const r = Math.min(w, h) / 2;
  const path = () => { g.beginPath(); g.roundRect(x, y, w, h, r); };
  g.save();
  path(); g.clip();
  g.fillStyle = 'rgba(255,255,255,.055)'; g.fillRect(x, y, w, h);
  g.filter = 'blur(37px)'; g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 80;
  path(); g.stroke(); g.filter = 'none';
  g.restore();
  // 유리 림 — 상단 밝고 하단 알파 0(유저 확정)
  const rim = g.createLinearGradient(0, y, 0, y + h);
  rim.addColorStop(0, 'rgba(255,255,255,.95)'); rim.addColorStop(.28, 'rgba(255,255,255,.28)');
  rim.addColorStop(.55, 'rgba(255,255,255,.16)'); rim.addColorStop(.80, 'rgba(255,255,255,.05)');
  rim.addColorStop(1, 'rgba(255,255,255,0)');
  g.strokeStyle = rim; g.lineWidth = 2.5; path(); g.stroke();
  return path;
}
// 엠버 글로우 — 캡슐 안쪽 하단(정본 4겹의 축약: 두 겹 라디얼)
function ember(g, cx, by, rx, k = 1) {
  g.save();
  g.translate(cx, by); g.scale(1, .46);
  for (const [r0, c0, c1, a] of [[rx, 'rgba(250,48,48,.55)', 'rgba(250,48,48,0)', .9],
                                 [rx * .62, 'rgba(255,236,214,.75)', 'rgba(254,176,120,0)', 1]]) {
    const rg = g.createRadialGradient(0, 0, 0, 0, 0, r0);
    rg.addColorStop(0, c0); rg.addColorStop(1, c1);
    g.globalAlpha = a * k; g.fillStyle = rg;
    g.beginPath(); g.arc(0, 0, r0, 0, 7); g.fill();
  }
  g.restore();
}
const titleBlock = (g, lines, cx, cy, size = 98) => {
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
  g.font = RF(700, size); g.letterSpacing = '-4px';
  lines.forEach((l, i) => g.fillText(l, cx, cy + (i - (lines.length - 1) / 2) * size * 1.18));
  g.letterSpacing = '0px';
};
const capLabel = (g, tx, cx, y, a = .55, s = 44) => {
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = `rgba(255,255,255,${a})`; g.font = RF(400, s); g.letterSpacing = '2px';
  g.fillText(tx, cx, y); g.letterSpacing = '0px';
};
// 코치 영상 자리 — 실제 판은 3D 로 뒤에 서지만, 시안에선 실루엣으로 자리를 표시
function coach(g, cx, cy, h, a = 1) {
  const im = img('fig/ready2/photo-runner.png');
  g.save(); g.globalAlpha *= a;
  if (im.complete && im.naturalWidth) {
    const s = h / im.naturalHeight;
    g.drawImage(im, cx - im.naturalWidth * s / 2, cy - h / 2, im.naturalWidth * s, h);
  } else { g.fillStyle = 'rgba(250,48,48,.5)'; g.beginPath(); g.ellipse(cx, cy, h * .16, h / 2, 0, 0, 7); g.fill(); }
  g.restore();
}
// 판정 마크(발자국) 자리 — 따라하기 시안의 하단 요소
function footMarks(g, cx, cy, s, t) {
  const p = (Math.sin(t * 2.2) + 1) / 2;
  for (const dir of [-1, 1]) {
    const x = cx + dir * 150 * s, k = dir < 0 ? p : 1 - p;
    g.save();
    const rg = g.createRadialGradient(x, cy, 0, x, cy, 130 * s);
    rg.addColorStop(0, `rgba(250,48,48,${.55 + .35 * k})`);
    rg.addColorStop(.55, `rgba(254,110,60,${.30 + .2 * k})`);
    rg.addColorStop(1, 'rgba(254,195,137,0)');
    g.fillStyle = rg; g.beginPath(); g.ellipse(x, cy, 130 * s, 165 * s, 0, 0, 7); g.fill();
    g.strokeStyle = `rgba(255,255,255,${.35 + .45 * k})`; g.lineWidth = 5 * s;
    g.beginPath(); g.ellipse(x, cy, 74 * s, 118 * s, 0, 0, 7); g.stroke();
    g.restore();
  }
}

// ═══ 시안 정의 ══════════════════════════════════════════════════════════════
// 프리뷰(관찰) — '지금 뭘 볼 차례인가'
const PREVIEW = [
  ['A · 캡슐 축소 + 상단 배지', '시작 캡슐이 그대로 **작아져** 화면 위로 올라가고, 남은 자리에 코치가 선다. 캡슐 안엔 동작명 + Preview 배지 + 카운트다운 링. 시작→관찰이 한 물체의 변형으로 읽힌다.',
    (g, t) => {
      const e = eOut(intro(t, .1, .9));
      const cw = 1018 - 200 * e, ch = 1541 - 720 * e, cx = 800, cy = 300;
      capsule(g, cx - cw / 2, cy, cw, ch);
      ember(g, cx, cy + ch - 150, cw * .46, .55);
      titleBlock(g, ['Neck And', 'Shoulder'], cx, cy + ch * .40, 86);
      capLabel(g, 'PREVIEW', cx, cy + ch * .40 - 190, .5, 40);
      ringGauge(g, cx, cy + ch * .74, 118, ((t * .33) % 1), { color: '#fff' });
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = '#fff'; g.font = RF(700, 96, DOT);
      g.fillText(String(3 - Math.floor((t * .99) % 3)), cx, cy + ch * .74 + 4);
      coach(g, cx, cy + ch + 430, 760, e);
    }],
  ['B · 캡슐 분할(위 = 정보 · 아래 = 무대)', '캡슐이 가로로 **갈라져** 위는 얇은 정보 알약, 아래는 코치가 서는 빈 무대. 유리 재질은 그대로라 같은 물체가 열린 것처럼 보인다. 시선이 아래(사람)로 자연히 내려간다.',
    (g, t) => {
      const e = eOut(intro(t, .1, .9));
      const cx = 800, gap = 60 * e;
      capsule(g, cx - 509, 300, 1018, 300 + 40 * (1 - e));
      titleBlock(g, ['Neck And Shoulder'], cx, 450, 72);
      capLabel(g, 'PREVIEW · 3', cx, 546, .5, 38);
      const sy = 300 + 300 + gap;
      capsule(g, cx - 509, sy, 1018, 1180);
      ember(g, cx, sy + 1030, 470, .5 * e);
      coach(g, cx, sy + 560, 900, e);
      arcGauge(g, cx - 460, sy + 1090, 920, (t * .33) % 1);
    }],
  ['C · 캡슐 열림(U자 무대)', '캡슐 하단이 **열려** U자 프레임이 되고 그 품에 코치가 선다. 림이 사람을 감싸 무대처럼 읽히고, 카운트다운은 열린 입구에 놓인다. 가장 극적이지만 프레임 인식은 약간 약해진다.',
    (g, t) => {
      const e = eOut(intro(t, .1, .9));
      const cx = 800, x0 = cx - 509, y0 = 300, w = 1018, h = 1541;
      const open = 620 * e;
      g.save();
      g.beginPath(); g.rect(x0 - 60, y0 - 60, w + 120, h - open + 60); g.clip();
      capsule(g, x0, y0, w, h);
      g.restore();
      // 열린 입구의 양쪽 림 — 아래로 잦아든다
      const rim = g.createLinearGradient(0, y0 + h - open, 0, y0 + h);
      rim.addColorStop(0, 'rgba(255,255,255,.22)'); rim.addColorStop(1, 'rgba(255,255,255,0)');
      g.strokeStyle = rim; g.lineWidth = 2.5;
      for (const dir of [-1, 1]) { g.beginPath(); g.moveTo(cx + dir * w / 2, y0 + h - open); g.lineTo(cx + dir * w / 2, y0 + h); g.stroke(); }
      coach(g, cx, y0 + h - open + 180, 980, e);
      ember(g, cx, y0 + h - 60, 520, .6);
      titleBlock(g, ['Neck And', 'Shoulder'], cx, y0 + 300, 88);
      capLabel(g, 'PREVIEW', cx, y0 + 150, .5, 40);
      ringGauge(g, cx, y0 + h + 60, 112, (t * .33) % 1, { color: '#fff' });
    }],
];
// 따라하기 — '지금 내가 뭘 하고 어떻게 되고 있나'
const FOLLOW = [
  ['A · 미니 캡슐 + 지면 마크', '캡슐이 화면 위 **미니 카드**로 물러나 동작명·남은 시간만 들고, 바닥은 판정 마크에게 통째로 내준다. 정보는 위, 몸은 아래 — 위계가 가장 명확하다.',
    (g, t) => {
      const e = eOut(intro(t, .1, .8)), cx = 800;
      capsule(g, cx - 380, 300, 760, 250);
      titleBlock(g, ['High Knees'], cx, 400, 64);
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = '#fff'; g.font = RF(700, 62, DOT); g.fillText('12', cx - 26, 492);
      capLabel(g, 'sec', cx + 58, 496, .55, 34);
      coach(g, cx, 1010, 720, e);
      footMarks(g, cx, 1720, 1, t);
      arcGauge(g, cx - 500, 2010, 1000, (t * .2) % 1);
    }],
  ['B · 캡슐 안에 무대(창)', '캡슐은 시작 때 크기를 **유지**하고, 그 안에 코치 창 + 마크가 함께 들어간다. 화면이 한 물체로 끝나 가장 정돈되지만, 마크가 캡슐 폭에 갇힌다.',
    (g, t) => {
      const e = eOut(intro(t, .1, .8)), cx = 800, y0 = 300, h = 1720;
      const path = capsule(g, cx - 509, y0, 1018, h);
      g.save(); path(); g.clip();
      coach(g, cx, y0 + 620, 800, e);
      ember(g, cx, y0 + h - 210, 470, .7);
      footMarks(g, cx, y0 + h - 300, .8, t);
      g.restore();
      titleBlock(g, ['High Knees'], cx, y0 + 180, 78);
      capLabel(g, '12 SEC LEFT', cx, y0 + 280, .5, 38);
      arcGauge(g, cx - 470, y0 + h + 60, 940, (t * .2) % 1);
    }],
  ['C · 캡슐 = 진행 자체(림이 차오름)', '캡슐 테두리가 **게이지가 된다** — 남은 시간이 림을 따라 차오르며 색이 뜨거워진다. 별도 게이지가 사라져 화면이 가장 조용하고, 시선은 코치와 마크에만 머문다.',
    (g, t) => {
      const e = eOut(intro(t, .1, .8)), cx = 800, x0 = cx - 509, y0 = 300, w = 1018, h = 1560;
      capsule(g, x0, y0, w, h);
      // 림 게이지 — 상단 12시에서 시계방향
      const p = (t * .2) % 1, r = w / 2;
      g.save();
      const gg = g.createLinearGradient(0, y0, 0, y0 + h);
      gg.addColorStop(0, '#FA3030'); gg.addColorStop(.6, '#FE6E3C'); gg.addColorStop(1, '#FEC389');
      g.strokeStyle = gg; g.lineWidth = 9; g.lineCap = 'round';
      g.shadowColor = 'rgba(254,110,60,.8)'; g.shadowBlur = 30;
      const per = 2 * (h - w) + 2 * Math.PI * r, run = per * p;
      g.beginPath();
      let d = run;
      const seg = (fn, len) => { if (d <= 0) return; fn(Math.min(1, d / len)); d -= len; };
      seg(k => { g.moveTo(cx, y0); g.lineTo(cx + (w / 2) * k * 0, y0); }, 0.001);
      // 우측 직선 → 하단 반원 → 좌측 직선 → 상단 반원 (근사 경로)
      g.moveTo(x0 + w, y0 + r);
      const L1 = h - w;
      if (run > 0) g.lineTo(x0 + w, y0 + r + Math.min(L1, run));
      if (run > L1) g.arc(cx, y0 + h - r, r, 0, Math.min(Math.PI, (run - L1) / r));
      if (run > L1 + Math.PI * r) { const u = Math.min(L1, run - L1 - Math.PI * r); g.lineTo(x0, y0 + h - r - u); }
      if (run > 2 * L1 + Math.PI * r) g.arc(cx, y0 + r, r, Math.PI, Math.PI + Math.min(Math.PI, (run - 2 * L1 - Math.PI * r) / r));
      g.stroke(); g.restore();
      coach(g, cx, y0 + 700, 860, e);
      ember(g, cx, y0 + h - 250, 480, .6);
      footMarks(g, cx, y0 + h - 330, .82, t);
      titleBlock(g, ['High Knees'], cx, y0 + 200, 80);
    }],
];

// ═══ 4패턴 공통 시스템 — 러닝·농구 24 스테이지 수집 결과 ═══════════════════════
//   모든 따라하기 화면 = [① 정체 · ② 시계 · ③ 판정] 세 슬롯. 패턴 차이는 ②뿐이다.
//   ①은 상단 캡슐 · ②는 캡슐 내부 · ③은 지면 — 이 조판은 네 패턴에서 완전히 같다.
function slotFrame(g, t, o) {
  // ★ 조판은 floorgl.buildScene 의 **한 세로 열** 그대로다(유저 지적 08-05: 하단에 그런 뷰 없다).
  //   열 순서: [크럼] → 타이틀 → (프리뷰 링) → **아크(진행)** → (수치행) → 성공 배지.
  //   아크는 화면 바닥에 따로 떠 있는 게 아니라 이 열의 한 칸이다. 바닥은 비어 있다.
  const cx = 800, cy = 300, cw = 818, ch = 250;
  const e = eOut(intro(t, .1, .8));
  // ① 정체 — 상단 캡슐(동작명)
  capsule(g, cx - cw / 2, cy, cw, ch);
  titleBlock(g, [o.title], cx, cy + 118, 64);
  // ② 시계 — 캡슐 **아래 열의 다음 칸**. 패턴이 갈리는 유일한 자리
  o.clock(g, t, cx, cy + ch + 130);
  // ③ 판정 — 그 아래 칸(수치행·마크). 코치 판은 관찰이 있는 패턴에만(COACH_CFG 실측)
  if (o.coach !== false) coach(g, cx, 1320, 700, e);
  o.verdict(g, t, cx);
}
const dotsBar = (g, t, cx, y, p) => arcGauge(g, cx - 380, y - 40, 760, clamp01(p));
const SYS = [
  ['A · 관찰 후 따라하기', 'A2 종아리 · A3 하이니 · BK_A3 스쿼트<br><b>② 시계 = 프리뷰 링 → 도트바</b> (같은 슬롯을 물려받는다)',
    (g, t) => slotFrame(g, t, { title: 'High Knees', tall: true,
      clock: (g2, t2, cx, by) => {
        const pv = 3, inPv = (t2 % 8) < pv;
        if (inPv) {   // 프리뷰: 필 + 카운트 링 → 끝나면 같은 자리를 아크가 물려받는다
          capLabel(g2, 'PREVIEW', cx - 150, by, .6, 40);
          ringGauge(g2, cx + 130, by, 74, ((t2 % pv) / pv), { color: '#fff' });
          g2.textAlign = 'center'; g2.textBaseline = 'middle';
          g2.fillStyle = '#fff'; g2.font = RF(700, 58, DOT);
          g2.fillText(String(pv - Math.floor(t2 % pv)), cx + 130, by + 4);
        } else arcGauge(g2, cx - 380, by - 30, 760, ((t2 % 8) - pv) / (8 - pv));
      },
      verdict: (g2, t2, cx) => footMarks(g2, cx, 1900, 1, t2),
      prog: t2 => (t2 % 8) / 8 })],
  ['B · 큐만 있는 반복', 'A1 목·어깨 · BK_A1 옆구리 · BK_B1 드리블<br><b>② 시계 = 도트바만</b> (관찰 단계 생략 — 동작이 단순)',
    (g, t) => slotFrame(g, t, { title: 'Neck Rolls',
      clock: (g2, t2, cx, by) => {
        g2.textAlign = 'center'; g2.textBaseline = 'middle';
        g2.fillStyle = '#fff'; g2.font = RF(700, 56, DOT);
        g2.fillText(String(4 - Math.floor((t2 % 8) / 2)), cx - 26, by - 70);
        capLabel(g2, 'left', cx + 52, by - 66, .55, 32);
        arcGauge(g2, cx - 380, by - 30, 760, (t2 % 8) / 8);
      },
      verdict: () => {},
      prog: t2 => (t2 % 8) / 8 })],
  ['C · 분해 스텝', 'BK_B2~B5 스텝백 1/4~4/4<br><b>② 시계 = 루프 n/4</b> (초가 아니라 반복 횟수 · 도트바 없음)',
    (g, t) => slotFrame(g, t, { title: 'Step-Back 2/4',
      clock: (g2, t2, cx, by) => {
        const n = 1 + Math.floor((t2 % 8) / 2);

        g2.textAlign = 'center'; g2.textBaseline = 'middle';
        g2.fillStyle = '#fff'; g2.font = RF(700, 50, DOT);
        g2.fillText(n + '/4', cx + 120, by + 4);
      },
      verdict: (g2, t2, cx) => {
        footMarks(g2, cx, 1900, .9, t2);
        g2.save(); g2.strokeStyle = 'rgba(255,222,194,.9)'; g2.lineWidth = 8; g2.lineCap = 'round';
        g2.shadowColor = 'rgba(254,195,137,.7)'; g2.shadowBlur = 18;
        g2.beginPath(); g2.moveTo(cx - 40, 2090); g2.lineTo(cx + 120, 2090); g2.stroke();
        g2.beginPath(); g2.moveTo(cx + 76, 2056); g2.lineTo(cx + 124, 2090); g2.lineTo(cx + 76, 2124); g2.stroke();
        g2.restore();
      },
      prog: t2 => (t2 % 8) / 8 })],
  ['D · 실전 동행', 'P1~P3 훈련 · C2~C5 실전 · BK_C2<br><b>② 시계 = 연속 아크</b> (끝이 아니라 <b>지금 상태</b>가 주인공)',
    (g, t) => slotFrame(g, t, { title: 'Interval', coach: false,
      clock: (g2, t2, cx, by) => {

// ═══ 전환 인터랙션 — 프리뷰 A → 따라하기 A 를 한 타임라인으로(유저: 전환도 미리보기) ═══
//   한 물체(캡슐)가 물러나며 작아지고, 그 자리를 사람과 지면 마크가 이어받는다.
const T_HOLD = 1.6, T_MOVE = 1.0, CY_LOOP = 5.4;
function drawFlow(g, t) {
  const cx = 800;
  const m = clamp01((t - T_HOLD) / T_MOVE), me = eOut(m);          // 전환 진행
  const post = clamp01((t - (T_HOLD + T_MOVE)) / .9);              // 따라하기 요소 등장
  const intro0 = eOut(intro(t, .05, .8));
  // ① 캡슐 — 관찰(큰 캡슐) → 따라하기(미니 카드). 폭·높이·y 를 한 번에 보간
  const cw = 818 - 58 * me, ch = 821 - 571 * me, cy = 300 - 0 * me;
  capsule(g, cx - cw / 2, cy, cw, ch);
  ember(g, cx, cy + ch - 120, cw * .46, .5 * (1 - me * .6));
  // ② 타이틀 — 관찰은 2줄 크게, 따라하기는 1줄 작게(크로스페이드)
  // 순차 크로스페이드 — 옛 것이 먼저 빠지고(0~45%) 새 것이 뒤에 든다(55~100%).
  //   동시에 페이드하면 중간에 두 타이틀이 겹쳐 읽힌다(실측).
  const outA = 1 - clamp01(m / .45), inA = clamp01((m - .55) / .45);
  g.save(); g.globalAlpha = outA * intro0;
  titleBlock(g, ['Neck And', 'Shoulder'], cx, cy + ch * .40, 86);
  capLabel(g, 'PREVIEW', cx, cy + ch * .40 - 175, .5, 40);
  g.restore();
  g.save(); g.globalAlpha = inA;
  titleBlock(g, ['High Knees'], cx, cy + 100, 64);
  g.restore();
  // ③ 카운트 링 → 남은 시간 배지 — 같은 자리에서 형태가 바뀐다(정보의 연속)
  const ry = cy + ch * .74 - 320 * me;
  g.save(); g.globalAlpha = outA;
  ringGauge(g, cx, ry, 112, ((t * .62) % 1), { color: '#fff' });
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#fff'; g.font = RF(700, 92, DOT);
  g.fillText(String(Math.max(1, 3 - Math.floor(t * 1.9))), cx, ry + 4);
  g.restore();
  g.save(); g.globalAlpha = inA;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#fff'; g.font = RF(700, 62, DOT); g.fillText('12', cx - 26, cy + 192);
  capLabel(g, 'sec', cx + 58, cy + 196, .55, 34);
  g.restore();
  // ④ 코치 — 관찰에선 캡슐 아래, 전환하며 앞(위)으로 걸어 나온다
  coach(g, cx, 1560 - 520 * me, 760 + 60 * me, intro0);
  // ⑤ 지면 마크 — 전환이 끝나며 아래에서 떠오른다
  if (post > 0.01) {
    g.save(); g.globalAlpha = post;
    footMarks(g, cx, 1900 - 60 * eOut(post), 1, t);
    g.restore();
  }
  // ⑥ 아크 게이지 — 따라하기의 시계
  if (post > 0.01) { g.save(); g.globalAlpha = post; arcGauge(g, cx - 500, 2150, 1000, clamp01((t - 2.6) / 2.8)); g.restore(); }
}
let FPLAY = true, FT = 0, FLAST = performance.now();
let MODE = 'preview';
const row = document.getElementById('row'), ttl = document.getElementById('ttl');
const cells = [];
function build() {
  row.innerHTML = ''; cells.length = 0;
  document.getElementById('flowbar').style.display = MODE === 'flow' ? '' : 'none';
  ttl.textContent = MODE === 'preview' ? '프리뷰(관찰) — 3안'
    : MODE === 'follow' ? '따라하기 — 3안'
    : MODE === 'sys' ? '따라하기 4패턴 — 공통 3슬롯 시스템 [① 정체(캡슐) · ② 시계(캡슐 내부) · ③ 판정(지면)]'
    : '프리뷰 → 따라하기 전환 (A안 · 5.4초) — 슬라이더로 스크럽';
  if (MODE === 'flow') {
    const d = document.createElement('div'); d.className = 'cell'; d.style.width = '420px';
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    cv.style.width = '420px'; cv.style.height = '700px';
    d.append(cv, Object.assign(document.createElement('div'), { className: 'ds',
      innerHTML: '<b style="color:#E9EAEE">0.0~1.6s</b> 관찰 — 캡슐이 크게 서고 카운트다운 3·2·1<br>'
        + '<b style="color:#E9EAEE">1.6~2.6s</b> <b>전환</b> — 캡슐이 위로 물러나며 축소, 코치가 앞으로, 카운트 링이 필 배지로 형태 변환<br>'
        + '<b style="color:#E9EAEE">2.6~5.4s</b> 따라하기 — 지면 마크가 아래에서 떠오르고 아크 게이지가 차오른다' }));
    row.appendChild(d); cells.push([cv, drawFlow]);
    return;
  }
  for (const [nm, ds, fn] of (MODE === 'preview' ? PREVIEW : MODE === 'sys' ? SYS : FOLLOW)) {
    const d = document.createElement('div'); d.className = 'cell';
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    d.append(cv, Object.assign(document.createElement('div'), { className: 'nm', textContent: nm }),
             Object.assign(document.createElement('div'), { className: 'ds', innerHTML: ds.replace(/\*\*(.+?)\*\*/g, '<b style="color:#E9EAEE">$1</b>') }));
    row.appendChild(d); cells.push([cv, fn]);
  }
}
for (const [k, lb] of [['preview', '프리뷰(관찰)'], ['follow', '따라하기'], ['flow', '▶ 전환 인터랙션 (A안)'], ['sys', '◆ 4패턴 공통 시스템']]) {
  const b = document.createElement('button'); b.textContent = lb;
  if (k === MODE) b.className = 'on';
  b.onclick = () => { MODE = k; document.querySelectorAll('.seg button').forEach(x => x.classList.remove('on')); b.classList.add('on'); build(); };
  document.getElementById('seg').appendChild(b);
}
document.getElementById('fscrub').addEventListener('input', e => { FPLAY = false; FT = +e.target.value; fp.textContent = '▶ 재생'; });
const fp = document.getElementById('fplay');
fp.onclick = () => { FPLAY = !FPLAY; fp.textContent = FPLAY ? '⏸ 정지' : '▶ 재생'; };
build();
const T0 = performance.now();
(function loop() {
  const now = performance.now();
  if (MODE === 'flow') {
    if (FPLAY) { FT = (FT + (now - FLAST) / 1000) % CY_LOOP; document.getElementById('fscrub').value = FT.toFixed(2); }
    document.getElementById('ftime').textContent = FT.toFixed(2) + 's';
  }
  FLAST = now;
  const t = MODE === 'flow' ? FT : (now - T0) / 1000 % 8;
  for (const [cv, fn] of cells) {
    const g = cv.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H);
    try { fn(g, t); } catch (e) { /* 시안 — 한 셀이 죽어도 나머지는 돈다 */ }
  }
  requestAnimationFrame(loop);
})();
