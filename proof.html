<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>NEWTON 발자국 — 접지 문법 증명 2건</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦶</text></svg>">
<style>
  html,body{margin:0;min-height:100%;background:#0A0C10;color:#E9EAEE;
    font:12px/1.5 -apple-system,'Malgun Gothic',sans-serif;display:grid;place-items:center}
  .wrap{padding:24px;display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
  .panel{width:min(44vw,470px)}
  h2{font-size:14px;margin:0 0 2px}
  .sub{color:#98A1AD;font-size:11.5px;margin:0 0 10px}
  canvas{display:block;width:100%;height:auto;border-radius:12px;background:#0A0C10}
  .cue{margin-top:10px;min-height:34px}
  .cue b{display:block;font-size:13px}
  .cue span{color:#98A1AD;font-size:11.5px}
  .beats{display:flex;gap:4px;margin-top:8px}
  .beats i{flex:1;height:3px;background:#1D222C;border-radius:2px}
  .beats i.on{background:#FA3030}
  .read{color:#98A1AD;font-size:11px;margin-top:8px;font-variant-numeric:tabular-nums}
</style></head><body>
<div class=wrap>
  <div class=panel>
    <h2>① 런지 · 뒷종아리 풀기</h2>
    <p class=sub>A2 정본 — 늘어나는 건 <b>뒷발</b>이다. 뒤꿈치를 눌러 버티는 쪽.</p>
    <canvas id=cvA></canvas>
    <div class=cue id=cueA></div><div class=beats id=beatA></div><div class=read id=readA></div>
  </div>
  <div class=panel>
    <h2>② 농구 · 4/4 스텝</h2>
    <p class=sub>marklang <code>BK_STEPBACK</code> 정본 4단계. 하중·이동을 그대로 읽는다.</p>
    <canvas id=cvB></canvas>
    <div class=cue id=cueB></div><div class=beats id=beatB></div><div class=read id=readB></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLYPHS, footSDFTexture, FXP } from '/src/fxlut.js';
import { LOAD, BK_STEPBACK } from '/src/marklang.js';
// ★ 좌표 정본 = session.js SB_POSE / sbPoseAt. 여기 좌표를 적으면 시뮬과 갈린다(marklab.js 규율).
//   sbPoseAt 은 이징(step 은 후반에 확 · slide 는 초반에 확)과 체공 여부까지 같이 준다.
import { SB_POSE, SB_BOX, sbPoseAt } from '/src/session.js';
import { makeMarkFXMaterial, applyMarkLookTo, setMarkStateLook, setMarkLoad,
         FOOT_LEN_M, FOOT_PLANE_M, QUAD_K } from '/src/tokens.js';

FXP.footCtx = 'out';   // 신발 안에서 일어난다 — 겉 = 깔창 · 안 = 맨발 프린트

// ★ 증명의 핵심 — **하중 어휘(LOAD) 하나가 접지 창 하나를 정한다.**
//   이 표만 있으면 어떤 동작이든(정지 홀드든 4박 스텝이든) 같은 부품으로 그려진다.
//   좌표계는 plantar 해부학 좌표(볼 (0.02,0.30) · 뒤꿈치 (0,−0.44) · 엄지 (0.17,0.56)).
const CONTACT = {
  off:   { cop: [ 0.12,  0.46], r: [0.10, 0.08], a: 0.0 },   // 체공 — 닿지 않는다
  heel:  { cop: [-0.06, -0.42], r: [0.24, 0.20], a: 1.0 },   // 뒤꿈치만
  flat:  { cop: [ 0.00,  0.02], r: [0.42, 0.60], a: 1.0 },   // 발바닥 전체
  toe:   { cop: [ 0.06,  0.34], r: [0.34, 0.26], a: 1.0 },   // 앞볼
  drive: { cop: [ 0.15,  0.50], r: [0.26, 0.20], a: 1.0 },   // 엄지로 민다
};

const LOOK = { imp: 0, glow: 0, shade: 0, rip: 0, halo: 0, op: 1, shadeRed: 0, dither: 0,
               edgeSoft: 1, edgeW: 0.10, edgeShade: 0.38, edgeShadeW: 1.0, edgeShadeGrad: 1,
               tLo: 0.02, tHi: 0.86, dotMode: 0,
               plantar: 1, loadGain: 2.6, loadBase: 0.10, bands: 0, pool: 0.9, pressA: 0 };

// ── ① 런지 종아리 — 정지 동작이다. 발은 안 움직이고 **하중만** 뒷발 뒤꿈치로 실린다.
//   4박: 들어가기 → 누르기(뒤꿈치) → 버티기 → 풀기. 뒷발이 늘어나는 발(session A2 정본).
const LUNGE = [
  { t: 0,    front: 'flat', back: 'toe',   title: '자세 잡기',      cue: '앞무릎 굽히고 뒷다리 뒤로' },
  { t: 0.22, front: 'flat', back: 'flat',  title: '뒤꿈치 내리기',  cue: '뒷발 뒤꿈치를 바닥에 붙인다' },
  { t: 0.42, front: 'toe',  back: 'heel',  title: '버티기 · 5초',   cue: '뒷발 뒤꿈치를 눌러 종아리를 늘린다' },
  { t: 0.82, front: 'flat', back: 'flat',  title: '풀기',           cue: '체중을 앞뒤로 고르게 되돌린다' },
  { t: 1.0,  front: 'flat', back: 'toe',   title: '자세 잡기',      cue: '앞무릎 굽히고 뒷다리 뒤로' },
];

// ── ② 농구 4/4 — 정본에서 그대로 읽는다. 숫자를 여기 적지 않는다.
//   ★ 마지막에 첫 항목을 t=1 로 한 번 더 넣는다. step() 이 구간을 [i, i+1] 로 잡으므로
//     꼬리 키가 없으면 **마지막 박(BK_B4)이 영영 안 나온다** — 실제로 3박만 돌고 있었다.
const _BK = Object.entries(BK_STEPBACK).map(([id, s], i, all) => ({
  t: i / all.length, id, title: (s.n ? s.n + ' · ' : '') + s.title, cue: s.cue,
  L: s.L.load, R: s.R.load, mvL: s.L.move, mvR: s.R.move,
}));
const BK = [..._BK, { ..._BK[0], t: 1 }];

const lerp = (a, b, f) => a + (b - a) * f;
function blend(A, B, e) {   // 접지 창 두 개를 섞는다 — 하중이 옮겨 가는 게 곧 애니메이션이다
  return { cop: [lerp(A.cop[0], B.cop[0], e), lerp(A.cop[1], B.cop[1], e)],
           r:   [lerp(A.r[0],   B.r[0],   e), lerp(A.r[1],   B.r[1],   e)],
           a:   lerp(A.a, B.a, e) };
}
function step(seq, u, key) {
  let i = 0; while (i < seq.length - 2 && u > seq[i + 1].t) i++;
  const a = seq[i], b = seq[i + 1] || seq[i];
  const f = Math.max(0, Math.min(1, (u - a.t) / Math.max(1e-4, (b.t ?? 1) - a.t)));
  const e = f * f * (3 - 2 * f);
  return { a, b, e, i, na: a[key], nb: (b[key] ?? a[key]) };
}

function makePanel(canvasId, cueId, beatId, readId, seq, feet, period, pose) {
  const cv = document.getElementById(canvasId);
  const W = FOOT_LEN_M * 2.0, H = FOOT_LEN_M * 2.3, PPM = 620;
  cv.width = Math.round(W * PPM); cv.height = Math.round(H * PPM);
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
  renderer.setClearColor(0x0A0C10, 1);   // 알파 캔버스에 가산 합성하면 쿼드 영역만 알파가 쌓여 **사각형이 비친다**
  renderer.setPixelRatio(1); renderer.setSize(cv.width, cv.height, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const scene = new THREE.Scene();
  const cam = new THREE.OrthographicCamera(-W / 2, W / 2, H / 2, -H / 2, 0.01, 10);
  cam.position.z = 2;
  document.getElementById(beatId).innerHTML = seq.slice(0, -1).map(() => '<i></i>').join('');

  const mats = [];
  const build = () => {
    if (mats.length) return true;
    const S = FOOT_PLANE_M * QUAD_K;
    for (const f of feet) {
      const tex = footSDFTexture(f.right); if (!tex) { mats.length = 0; return false; }
      const mat = makeMarkFXMaterial(tex);
      mat.uniforms.uOut.value = 0;
      mat.uniforms.uNumTex.value = mat.uniforms.uLUT.value;
      setMarkStateLook(mat, 1); applyMarkLookTo(mat, LOOK);
      mat.uniforms.uPhase.value = 1; mat.uniforms.uProg.value = 0;
      const m = new THREE.Mesh(new THREE.PlaneGeometry(S, S), mat);
      m.position.set(f.x, f.y, 0);
      m.rotation.z = THREE.MathUtils.degToRad(f.rot || 0);
      scene.add(m); mats.push({ mat, f, mesh: m });
    }
    return true;
  };
  return { renderer, scene, cam, mats, build, seq, period, pose,
           cue: document.getElementById(cueId), beat: document.getElementById(beatId),
           read: document.getElementById(readId) };
}

const A = makePanel('cvA', 'cueA', 'beatA', 'readA', LUNGE,
  [{ right: false, x: -0.055, y:  0.135, key: 'front', rot: 0 },
   { right: true,  x:  0.055, y: -0.135, key: 'back',  rot: 0 }], 4.2);
const B = makePanel('cvB', 'cueB', 'beatB', 'readB', BK,
  [{ right: false, x: -0.085, y: 0.02, key: 'L', rot: 0 },
   { right: true,  x:  0.085, y: -0.02, key: 'R', rot: 0 }], 4.8, true);

// 스텝백 좌표 → 패널 좌표. 미터 그대로 쓰면 패널을 넘으므로 박스 중심 기준으로 눌러 담는다.
const SB_T0 = SB_POSE[0].t, SB_T1 = SB_POSE[SB_POSE.length - 1].t;
const SB_VC = (SB_BOX.v0 + SB_BOX.v1) / 2;
const SB_K = 0.20;   // SB_BOX.u 는 0.95m — 0.44 로 담으면 발이 패널 밖으로 나간다(실측 x ±0.42 · 반폭 0.30)

function tick(P, t) {
  if (!P.build()) return;
  const u = (t / P.period) % 1;
  // ── 위치 이동 — 좌표는 정본에서 읽는다(하중만 바꾸던 이전 판의 빈자리) ──
  const pose = P.pose ? sbPoseAt(SB_T0 + u * (SB_T1 - SB_T0)) : null;
  for (const { mat, f, mesh } of P.mats) {
    const s = step(P.seq, u, f.key);
    const CA = CONTACT[s.na] || CONTACT.flat, CB = CONTACT[s.nb] || CA;
    const c = blend(CA, CB, s.e);
    const L0 = LOAD[s.na] || LOAD.flat, L1 = LOAD[s.nb] || L0;
    setMarkLoad(mat, { ball: lerp(L0.ball, L1.ball, s.e),
                       heel: lerp(L0.heel, L1.heel, s.e),
                       toe:  lerp(L0.toe,  L1.toe,  s.e) });
    mat.uniforms.uLoadGain.value = LOOK.loadGain * lerp(L0.ink, L1.ink, s.e);
    mat.uniforms.uCop.value.set(c.cop[0], c.cop[1]);
    mat.uniforms.uCopR.value.set(c.r[0], c.r[1]);
    let amp = c.a;
    if (pose) {
      const q = pose[f.key];                       // f.key = 'L' | 'R'
      mesh.position.set(q.u * SB_K, (q.v - SB_VC) * SB_K, 0);
      // 체공 중이면 접지가 없다 — 들었다 놓는 스텝만. 슬라이드는 바닥에 붙은 채라 계속 닿아 있다.
      if (q.moving && !q.slide) amp = 0;
    }
    mat.uniforms.uCopA.value = amp;
    mat.uniforms.uTime.value = t;
  }
  const s0 = step(P.seq, u, P.mats[0].f.key);
  P.cue.innerHTML = `<b>${s0.a.title}</b><span>${s0.a.cue}</span>`;
  [...P.beat.children].forEach((el, i) => el.classList.toggle('on', i === s0.i));
  P.read.textContent = P.mats.map(({ f }) => {
    const s = step(P.seq, u, f.key);
    return `${f.key} ${s.na}${s.e > 0.02 && s.nb !== s.na ? '→' + s.nb : ''}`;
  }).join('   ·   ');
  P.renderer.render(P.scene, P.cam);
}

GLYPHS.onLoad(() => {});
const clock = new THREE.Clock();
function loop() { const t = clock.getElapsedTime(); tick(A, t); tick(B, t); requestAnimationFrame(loop); }
loop();
window.__proof = { CONTACT, LUNGE, BK, SB_BOX, sample: () => B.mats.map(x => [x.f.key, +x.mesh.position.x.toFixed(3), +x.mesh.position.y.toFixed(3), x.mat.uniforms.uCopA.value]) };
</script></body></html>
