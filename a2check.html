<!doctype html><meta charset="utf-8"><title>A2 니 드라이브 배치 검수</title>
<style>body{margin:0;background:#0b0d10;color:#9aa2ac;font:12px system-ui;text-align:center}
canvas{display:block;margin:8px auto;border:1px solid #1c2026}</style>
<canvas id="c" width="1180" height="440"></canvas>
<div>왼발 0 → 0.5 → 1.0, 마지막은 오른발 1.0 — 정면 대기 → 꼬이며 반대편 위로 교차, 작은 원은 딛던 자리에 남고 스템이 늘어난다</div>
<script>
// session.js 의 BK_A2 배치식을 그대로 옮겨 위에서 내려다본 그림으로 검증한다.
const CROSS = 0.24, LIFTZ = 0.16, TWIST = 25 * Math.PI / 180, A2X = 0.17, A2Z = -1.85;
const c = document.getElementById('c'), g = c.getContext('2d');
const CELL = 295, X0 = -0.42, X1 = 0.42, Z0 = -1.60, Z1 = -2.45;

function foot(g, s, p, act) {          // s: -1 왼발 · +1 오른발
  const mx = s * A2X - s * CROSS * p, mz = A2Z - LIFTZ * p, rot = -s * TWIST * p, sc = 1.05 * (1 + 0.16 * p);
  const dx = Math.sin(rot), dz = Math.cos(rot);                  // 뒤꿈치 방향 — 마크와 함께 돈다
  const dotx = mx + dx * 0.20 * sc, dotz = mz + dz * 0.20 * sc;
  const hx = mx + dx * 0.12 * sc, hz = mz + dz * 0.12 * sc;
  const px = (wx) => (wx - X0) / (X1 - X0) * CELL;
  const py = (wz) => (wz - Z1) / (Z0 - Z1) * (c.height - 40);    // −z = 화면 위
  // 스템
  { g.strokeStyle = `rgba(226,196,140,${0.30 + 0.5 * p})`; g.lineWidth = 5;
    g.beginPath(); g.moveTo(px(dotx), py(dotz)); g.lineTo(px(hx), py(hz)); g.stroke(); }
  // 작은 원
  g.strokeStyle = `rgba(226,196,140,${0.30 + 0.55 * p})`; g.lineWidth = 4;
  g.beginPath(); g.arc(px(dotx), py(dotz), 9, 0, 6.284); g.stroke();
  // 발마크 (발바닥 실루엣 근사)
  g.save(); g.translate(px(mx), py(mz)); g.rotate(-rot); g.scale(sc, sc);   // 캔버스 y는 아래 → 회전 부호 반전
  const W = 30, L = 88;
  g.fillStyle = act ? 'rgba(250,48,48,0.92)' : 'rgba(190,196,206,0.30)';
  g.beginPath(); g.ellipse(0, -L * 0.22, W * 0.62, L * 0.30, 0, 0, 6.284); g.fill();   // 앞볼
  g.beginPath(); g.ellipse(0, L * 0.26, W * 0.44, L * 0.22, 0, 0, 6.284); g.fill();    // 뒤꿈치
  g.fillRect(-W * 0.22, -L * 0.22, W * 0.44, L * 0.5);
  g.restore();
}

g.fillStyle = '#0b0d10'; g.fillRect(0, 0, c.width, c.height);
[[-1, 0], [-1, 0.5], [-1, 1], [1, 1]].forEach(([lift, p], i) => {
  g.save(); g.translate(i * CELL, 0);
  g.strokeStyle = '#191d23'; g.strokeRect(0.5, 0.5, CELL - 1, c.height - 40);
  foot(g, -lift, 0, false);          // 딛고 있는 발 = 정면 그대로
  foot(g, lift, p, true);            // 올라가는 발
  g.fillStyle = '#6d757f'; g.fillText((lift < 0 ? '왼발' : '오른발') + ' p=' + p, 10, 16);
  g.restore();
});
</script>
