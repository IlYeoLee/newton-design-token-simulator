<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEWTON — 씬 스테이지</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { display: flex; height: 100vh; background: #000; color: #eee; font-family: -apple-system, 'Noto Sans KR', sans-serif; }
  aside { width: 220px; padding: 18px 14px; background: #0d0d0d; border-right: 1px solid #1c1c1c; flex: none;
    display: flex; flex-direction: column; gap: 2px; transition: margin .25s ease; overflow-y: auto; }
  body.closed aside { margin-left: -220px; }
  #toggle { position: fixed; left: 10px; top: 10px; z-index: 10; width: 34px; height: 34px; border-radius: 9px;
    border: 1px solid #2a2a2a; background: rgba(15,15,15,.8); color: #ddd; font-size: 15px; cursor: pointer;
    backdrop-filter: blur(6px); padding: 0; text-align: center; }
  body:not(.closed) #toggle { left: 230px; }
  h1 { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; margin: 2px 4px 10px; }
  h1 span { color: #fa3030; }
  h2 { font-size: 11px; font-weight: 700; color: #777; letter-spacing: .08em; margin: 12px 6px 4px; }
  button.s { display: block; width: 100%; text-align: left; padding: 7px 10px; border: 0;
    border-radius: 8px; background: transparent; color: #ccc; font-size: 13px; font-weight: 500; cursor: pointer; }
  button.s:hover { background: #1c1c1c; }
  button.s.on { background: #fa3030; color: #fff; font-weight: 700; }
  main { flex: 1; position: relative; background: #000; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<button id="toggle" title="목록 열기/닫기">☰</button>
<aside id="list">
  <h1>NEWTON <span>씬</span></h1>
</aside>
<main><iframe id="f" src="./index.html?alpha=1&scene=BX_READY"></iframe></main>
<script>
  const GROUPS = [
    ['복싱', [
      ['BX_READY', '가드 올리고 거리 잡기'],
      ['BX_A1', '목 · 어깨 풀기'],
      ['BX_B2', '회피 스텝'],
      ['BX_T2', '5초 뒤 넘어가요'],
      ['BX_C1', '3 · 2 · 1'],
      ['BX_C3', '잽 - 잽 - 훅'],
    ]],
    ['농구', [
      ['BK_READY', '시작 화면'],
      ['BK_B1', '제자리 로우 드리블'],
      ['BK_B5', '스텝백 4/4 미리보기+스텝'],
    ]],
    ['러닝', [
      ['READY', '시작 화면'],
      ['A2', '종아리 늘리기 홀드'],
      ['P1', '이지 런'],
    ]],
  ];
  // 실사 배경 — public/_bg/ 에 넣어 둔 파일을 고르면 3D 실내 대신 그 사진 위에 투사된다.
  //   화면에서 바로 보면서 어둡기를 맞추고, 같은 값으로 내보내면 된다.
  const BGS = [
    ['', '없음 (3D 실내)'],
    ['/_bg/wall.png', '벽 — 정면'],
    ['/_bg/wall_side.png', '벽 — 측면'],
  ];
  // 캐시 무효화 — 같은 이름으로 사진을 교체해도 브라우저가 옛 이미지를 계속 쓴다(실제로 겪음).
  //   페이지를 열 때마다 새 토큰을 붙여 항상 최신 파일을 받는다.
  const V = '?v=' + Date.now();
  const bust = u => u ? u + V : '';
  let bgUrl = '', bgDim = 0, cur = 'BX_READY';
  // ★ alpha=1 은 **항상** 붙인다. 렌더러 알파는 생성 시점에 정해져서, 나중에 배경을 켜려면
  //   처음부터 켜져 있어야 한다. 배경이 없을 땐 아무 영향도 없다.
  const srcFor = s => './index.html?alpha=1&scene=' + encodeURIComponent(s)
    + (bgUrl ? '&bg=' + encodeURIComponent(bust(bgUrl)) + '&bgdim=' + bgDim : '');
  const list = document.getElementById('list'), f = document.getElementById('f');
  const btns = [];
  for (const [sport, scenes] of GROUPS) {
    const h = document.createElement('h2'); h.textContent = sport; list.appendChild(h);
    for (const [id, name] of scenes) {
      const b = document.createElement('button'); b.className = 's'; b.textContent = name; b.dataset.s = id;
      b.onclick = () => { btns.forEach(x => x.classList.toggle('on', x === b)); cur = id; f.src = srcFor(id); };
      list.appendChild(b); btns.push(b);
    }
  }
  btns[0].classList.add('on');

  // ── 배경 컨트롤 ────────────────────────────────────────────────
  const h = document.createElement('h2'); h.textContent = '배경'; list.appendChild(h);
  const sel = document.createElement('select');
  sel.style.cssText = 'width:100%;margin:2px 0 8px;padding:6px;border-radius:8px;background:#161616;color:#ddd;border:1px solid #2a2a2a;font-size:12px';
  for (const [v, t] of BGS) { const o = document.createElement('option'); o.value = v; o.textContent = t; sel.appendChild(o); }
  const lab = document.createElement('div');
  lab.style.cssText = 'font-size:11px;color:#777;margin:0 4px 4px';
  const rng = document.createElement('input');
  rng.type = 'range'; rng.min = -0.6; rng.max = 0.9; rng.step = 0.05; rng.value = 0;
  rng.style.cssText = 'width:100%';
  const sync = () => { lab.textContent = (rng.value < 0 ? '밝게 ' : '어둡게 ') + Math.abs(Number(rng.value)).toFixed(2); };
  // 리로드 없이 즉시 반영 — iframe 은 같은 출처라 안의 함수를 그대로 부를 수 있다.
  //   (배경을 '없음'으로 되돌릴 때만 앱이 스스로 리로드한다 — 껐던 무대를 되살려야 해서)
  const push = () => {
    const w = f.contentWindow;
    if (w?.__setSceneBg) w.__setSceneBg(bust(bgUrl), bgDim);
    else f.src = srcFor(cur);          // 아직 부팅 전이면 파라미터로 넘긴다
  };
  sel.onchange = () => { bgUrl = sel.value; push(); };
  rng.oninput = () => { sync(); bgDim = Number(rng.value); push(); };
  sync();
  list.append(sel, lab, rng);

  // ── 촬영 조정 ──────────────────────────────────────────────────
  //   전부 리로드 없이 즉시 반영된다. '리셋'을 누르면 손대기 전 상태로 정확히 돌아간다.
  const ADJ = [
    ['zoom',     '화각',       0.4,  2.5, 0.02, 1],
    ['pan',      '좌우',      -1.5,  1.5, 0.01, 0],
    ['tilt',     '상하',      -1.5,  1.5, 0.01, 0],
    ['dolly',    '거리',       0.5,  2,   0.01, 1],
    ['exposure', '노출·밝기',  0.3,  2.2, 0.01, 1],
    ['bloom',    '글로우',     0,    1.5, 0.01, 0.55],
    ['uiX',      'UI 좌우',   -1.5,  1.5, 0.01, 0],
    ['uiY',      'UI 상하',   -1.5,  1.5, 0.01, 0],
    ['opacity',  '투사 세기',  0.1,  1,   0.01, 1],
  ];
  // 시점 — 1인칭은 앱 토글을 그대로 쓴다(종목별 화각·VOR·1인칭 가독 보정이 딸려 온다).
  //   러닝·농구 지면 UI 는 실제로 내려다보는 각도에서 봐야 판단이 된다.
  const h4 = document.createElement('h2'); h4.textContent = '시점'; list.appendChild(h4);
  const vsel = document.createElement('select');
  vsel.style.cssText = sel.style.cssText;
  for (const [v, t] of [['flat', '평면 (대지 1:1)'], ['fp', '1인칭 (실제 시야)']]) {
    const o = document.createElement('option'); o.value = v; o.textContent = t; vsel.appendChild(o);
  }
  vsel.onchange = () => {
    const a = f.contentWindow?.__sceneAdj;
    if (a) a.fp = vsel.value === 'fp';
  };
  list.appendChild(vsel);

  // 합성 — 실사 공간에 얹는 방식. screen = 가산광(프로젝터의 물리) · normal = 잉크(연출).
  const h5 = document.createElement('h2'); h5.textContent = '합성'; list.appendChild(h5);
  const bsel = document.createElement('select');
  bsel.style.cssText = sel.style.cssText;
  for (const [v, t] of [['normal', '잉크 (불투명)'], ['screen', '빛 (가산 · 벽 질감 비침)']]) {
    const o = document.createElement('option'); o.value = v; o.textContent = t; bsel.appendChild(o);
  }
  bsel.onchange = () => {
    const w = f.contentWindow, a = w?.__sceneAdj;
    if (!a) return;
    a.blend = bsel.value;
    w.__setComposite?.(a.opacity, a.blend);
  };
  list.appendChild(bsel);

  const h3 = document.createElement('h2'); h3.textContent = '촬영 조정'; list.appendChild(h3);
  const rows = [];
  for (const [key, name, min, max, step, def] of ADJ) {
    const t = document.createElement('div');
    t.style.cssText = 'font-size:11px;color:#777;margin:6px 4px 2px';
    const r = document.createElement('input');
    r.type = 'range'; r.min = min; r.max = max; r.step = step; r.value = def;
    r.style.cssText = 'width:100%';
    const show = () => { t.textContent = name + '  ' + Number(r.value).toFixed(2); };
    r.oninput = () => {
      show();
      const w = f.contentWindow, a = w?.__sceneAdj;
      if (!a) return;
      a[key] = Number(r.value);
      if (key === 'opacity') w.__setComposite?.(a.opacity, a.blend);   // 합성은 캔버스 스타일
    };
    show(); list.append(t, r); rows.push([r, def]);
  }
  const rst = document.createElement('button');
  rst.textContent = '리셋';
  rst.style.cssText = 'width:100%;margin:12px 0 4px;padding:7px;border:1px solid #2a2a2a;border-radius:8px;background:#161616;color:#ddd;font-size:12px;cursor:pointer';
  rst.onclick = () => {
    const a = f.contentWindow?.__sceneAdj;
    for (const [r, def] of rows) { r.value = def; r.dispatchEvent(new Event('input')); }
    if (a) { Object.assign(a, { zoom: 1, pan: 0, tilt: 0, dolly: 1, exposure: 1, bloom: 0.55, uiX: 0, uiY: 0, opacity: 1, blend: "normal", fp: false }); vsel.value = "flat"; bsel.value = "normal"; f.contentWindow?.__setComposite?.(1, "normal"); }
  };
  list.appendChild(rst);
  // 값 표시용 — 지금 설정을 내보내기 명령으로 그대로 옮길 수 있게
  const dump = document.createElement('button');
  dump.textContent = '지금 값 복사';
  dump.style.cssText = rst.style.cssText;
  dump.onclick = () => {
    const a = f.contentWindow?.__sceneAdj || {};
    const s = `--scene ${cur}` + (bgUrl ? ` --bg <파일> --bgdim ${bgDim}` : '')
      + ` --zoom ${a.zoom} --pan ${a.pan} --tilt ${a.tilt} --dolly ${a.dolly}`
      + ` --exposure ${a.exposure} --bloom ${a.bloom}`
      + ` --uix ${a.uiX} --uiy ${a.uiY} --opacity ${a.opacity} --blend ${a.blend}${a.fp ? " --fp" : ""}`;
    navigator.clipboard?.writeText(s);
    dump.textContent = '복사됨 ✓'; setTimeout(() => dump.textContent = '지금 값 복사', 1200);
  };
  list.appendChild(dump);
  document.getElementById('toggle').onclick = () => document.body.classList.toggle('closed');
</script>
</body>
</html>
