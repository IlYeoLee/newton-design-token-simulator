<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEWTON — 씬 스테이지</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { display: flex; height: 100vh; background: #000; color: #eee; font-family: -apple-system, 'Noto Sans KR', sans-serif; }
  aside { width: 300px; padding: 34px 22px; background: #0d0d0d; border-right: 1px solid #1c1c1c; flex: none;
    display: flex; flex-direction: column; gap: 10px; transition: margin .25s ease; }
  body.closed aside { margin-left: -300px; }
  #toggle { position: fixed; left: 14px; top: 14px; z-index: 10; width: 42px; height: 42px; border-radius: 12px;
    border: 1px solid #2a2a2a; background: rgba(15,15,15,.8); color: #ddd; font-size: 18px; cursor: pointer;
    backdrop-filter: blur(6px); padding: 0; text-align: center; }
  body:not(.closed) #toggle { left: 314px; }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 18px; }
  h1 span { color: #fa3030; }
  button { display: block; width: 100%; text-align: left; padding: 16px 18px; border: 1px solid #222;
    border-radius: 14px; background: #151515; color: #eee; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: background .15s, border-color .15s; }
  button:hover { background: #1f1f1f; border-color: #333; }
  button.on { background: #fa3030; border-color: #fa3030; color: #fff; }
  main { flex: 1; position: relative; background: #000; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<button id="toggle" title="목록 열기/닫기">☰</button>
<aside>
  <h1>NEWTON <span>씬</span></h1>
  <button data-s="BX_READY">가드 올리고 거리 잡기</button>
  <button data-s="BX_A1">목 · 어깨 풀기</button>
  <button data-s="BX_B2">회피 스텝</button>
  <button data-s="BX_T2">5초 뒤 넘어가요</button>
  <button data-s="BX_C1">3 · 2 · 1</button>
  <button data-s="BX_C3">잽 - 잽 - 훅</button>
</aside>
<main><iframe id="f" src="./index.html?scene=BX_READY"></iframe></main>
<script>
  const f = document.getElementById('f');
  const btns = [...document.querySelectorAll('button[data-s]')];
  const go = (b) => { btns.forEach(x => x.classList.toggle('on', x === b)); f.src = './index.html?scene=' + encodeURIComponent(b.dataset.s); };
  btns.forEach(b => b.onclick = () => go(b));
  btns[0].classList.add('on');
  document.getElementById('toggle').onclick = () => document.body.classList.toggle('closed');
</script>
</body>
</html>
