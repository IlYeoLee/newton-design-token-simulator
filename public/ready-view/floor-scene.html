<!doctype html>
<!-- 러닝·농구 운동중 지면 화면 (세로 1600×2670) — Figma 복싱 node 85-3995 세로 이식.
     타이틀(촤라락 글자 캐스케이드) + 원형 도트 프로그래스(복싱 scene.html 컴포넌트 재사용) + 하단 가로 페이즈 스트립.
     중앙은 콘텐츠 영역(발자국·가이드=WebGL 토큰)이라 비움(투명). ?stage=&dur= 로 주입. -->
<html lang="en"><head><meta charset="utf-8"><title>Newton — 운동중(지면)</title><style>
@font-face{font-family:'Supreme';src:url('../fonts/Supreme-Bold.woff2') format('woff2');font-weight:700;font-display:block}
@font-face{font-family:'Supreme';src:url('../fonts/Supreme-Medium.woff2') format('woff2');font-weight:500;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
#board{position:relative;width:1600px;height:2670px;overflow:hidden;
  font-family:'Supreme',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}

/* 상단: 지시 타이틀(짧게) — 글자 하나하나 촤라락 슬라이드인 */
.title{position:absolute;top:176px;left:0;right:0;text-align:center;white-space:nowrap;
  font-weight:700;font-size:120px;line-height:1.05;letter-spacing:-4px}
.title .ch{display:inline-block;animation:chIn .6s cubic-bezier(.2,.75,.2,1) both}
.title .sp{display:inline-block;width:.28em}
/* 타이틀 밑 짧은 지시(발자국 아래 있던 보조설명을 여기로 올림) */
.cue{position:absolute;top:326px;left:0;right:0;text-align:center;white-space:nowrap;
  font-weight:500;font-size:52px;color:rgba(255,255,255,.72);letter-spacing:-1px;
  opacity:0;animation:sUpFlat .6s .28s both}

/* 타이틀 아래: 원형 도트 로딩바(복싱 scene.html과 동일 규약) — 회색 위 빨강을 클립으로 좌→우 드러내며 --dur 동안 0→100% */
.dots{position:absolute;top:452px;left:50%;transform:translateX(-50%);height:60px;
  opacity:0;animation:sUp .6s .42s both}
.drow{display:flex;height:60px}
.dot{width:60px;height:60px;border-radius:999px;flex:0 0 auto}
.dot.g{background:#d0d0d0}
.dot.r{background:#fa3030}
.dclip{position:absolute;left:0;top:0;height:60px;overflow:hidden;width:0;animation:dotsFill var(--dur,8s) linear both}
@keyframes dotsFill{from{width:0}to{width:600px}}

/* 하단: 페이즈 스트립(가로) — 현재 볼드+sub / 나머지 흐리게 */
.phases{position:absolute;top:2168px;left:0;right:0;display:flex;justify-content:center;align-items:baseline;gap:64px;
  opacity:0;animation:sUp .7s .5s both}
.phase{font-weight:500;font-size:46px;color:rgba(255,255,255,.4);letter-spacing:-1px;white-space:nowrap}
.phase.active{font-weight:700;font-size:58px;color:#fff;text-shadow:0 0 28px rgba(255,255,255,.4);
  animation:phasePulse 2.4s 1.4s ease-in-out infinite}

/* 지면에 눕힌 프레임 = 세로 translate가 원근상 '깊이 이동'(멀리서 날아옴)으로 보임 →
   등장은 제자리 스케일+페이드로(그 자리에서 자연스럽게 나타남). */
@keyframes chIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@keyframes sUp{from{opacity:0;transform:translateX(-50%) scale(.94)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes dotPad{}
@keyframes phasePulse{0%,100%{opacity:1}50%{opacity:.62}}
.phases{animation-name:sUpFlat}
@keyframes sUpFlat{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}

/* 시범 미니 타이머 — 실전직전 타이머(floor-timer.html, Figma 52-3084) 링을 소형 이식.
   시범 = 무조건 3초: 아크 3s 채움 + 중앙 3→1 + DEMO 라벨, 끝나면 페이드아웃. */
@font-face{font-family:'OffBit';src:url('../fonts/OffBitTrial-DotBold.woff2') format('woff2');font-weight:700;font-display:block}
#demo-timer{position:absolute;top:430px;left:82%;transform:translateX(-50%);width:230px;height:230px;
  opacity:0;animation:sUp .5s .15s both, demoOut .45s 5.05s both}
#demo-timer svg{position:absolute;inset:0;width:100%;height:100%}
#demo-timer .arc{stroke-dasharray:1727.9;stroke-dashoffset:1727.9;animation:arcFill 5s .15s linear both}
@keyframes arcFill{from{stroke-dashoffset:1727.9}to{stroke-dashoffset:0}}
#demo-timer .dnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'OffBit','Supreme',sans-serif;font-size:104px;color:#fff;line-height:1}
#demo-timer .dlbl{position:absolute;top:246px;left:50%;transform:translateX(-50%);
  font-weight:700;font-size:38px;letter-spacing:6px;color:rgba(255,255,255,.85);white-space:nowrap}
#demo-timer .tip{position:absolute;inset:0;transform-origin:center;animation:tipSpin 5s .15s linear both}
#demo-timer .tip img{position:absolute;left:50%;top:-3px;width:30px;height:30px;transform:translateX(-50%);
  filter:drop-shadow(0 0 8px rgba(250,48,48,.6))}
@keyframes tipSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes demoOut{to{opacity:0;transform:translateX(-50%) scale(.85)}}
#spm-lbl{position:absolute;top:300px;left:0;right:0;text-align:center;font-family:'Supreme',sans-serif;
  opacity:0;animation:sUpFlat .6s .4s both}
#spm-lbl b{font-weight:700;font-size:150px;letter-spacing:-4px;color:#fff;text-shadow:0 0 34px rgba(250,48,48,.45)}
#spm-lbl span{font-weight:500;font-size:56px;color:rgba(255,255,255,.72);margin-left:14px}
#next-lbl{position:absolute;top:104px;left:0;right:0;text-align:center;font-family:'Supreme',sans-serif;font-weight:700;font-size:54px;
  letter-spacing:8px;color:rgba(255,255,255,.8);opacity:0;
  animation:sUpFlat .5s .1s both, demoOutFlat .45s 5.05s both}
@keyframes demoOutFlat{to{opacity:0}}

/* 훈련(P) 라이브 정보 — floor-timer(Figma 52-3084) 정본 스타일 그대로(유저): 점선 트랙 + 채우는
   아크 + 회전 팁 + 중앙 숫자. 컬러만 구간강도로. flex 정렬(링→구간명). 전체 시간은 도트(#s-dots). */
#train-live{position:absolute;top:60px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:44px;
  font-family:'Supreme',sans-serif;opacity:0;animation:sUpFlat .6s .5s both}
#tp-ring{position:relative;width:344px;height:344px}
#tp-ring svg{position:absolute;inset:0;width:100%;height:100%}
#tp-ring #tp-arc{transition:stroke .35s}
#tp-tip{position:absolute;inset:0;transform-origin:center}
#tp-tip img{position:absolute;left:50%;top:-4px;width:44px;height:44px;transform:translateX(-50%);
  filter:drop-shadow(0 0 14px rgba(250,48,48,.6))}
#tp-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'OffBit','Supreme',sans-serif;font-size:150px;color:#fff;line-height:1}
#tp-phase{font-weight:700;font-size:66px;letter-spacing:2px;color:#fff;white-space:nowrap;
  text-shadow:0 0 26px rgba(255,255,255,.38);transition:color .35s}
#tp-cad{margin-top:-28px;font-weight:500;font-size:40px;letter-spacing:1px;color:rgba(255,255,255,.6);white-space:nowrap}
</style></head><body>
  <div id="board">
    <div class="title" id="s-title">Title</div>
    <div class="cue" id="s-cue"></div>
    <div class="dots" id="s-dots">
      <div class="drow" id="drow-g"></div>
      <div class="dclip"><div class="drow" id="drow-r"></div></div>
    </div>
      </div>
  <script src="floor-scenes.js"></script>
  <script>
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const stage = params.get('stage') || 'A1';
  const S = window.FLOOR_SCENES[stage] || { title: stage, phase: 0, sub: '' };
  // 타이틀 — 글자 분해 후 좌→우 촤라락 슬라이드인 (유저: 타이틀+보조설명 유지, 하단 페이즈 스트립만 제거)
  (function(){
    const t = $('s-title'); t.textContent = ''; let vis = 0;
    [...S.title].forEach(c => { const s = document.createElement('span');
      if (c === ' ') { s.className = 'sp'; }
      else { s.className = 'ch'; s.textContent = c; s.style.animationDelay = (0.1 + vis * 0.045) + 's'; vis++; }
      t.appendChild(s); });
  })();
  // 보조설명(cue) 은퇴(유저: 실제 운동 영상엔 없음) — 타이틀+도트만. 단 훈련(P1~P4)은 예외:
  //   1인칭 가독을 위해 (a) cue(영문 짧은 설명)를 되살리고, (b)(c) 하단 근거리에 라이브 훈련 정보 편입.
  if (/^P\d$/.test(stage)) {
    $('s-title').style.display = 'none';                  // P단계 = 데모 타이머 링 하나로 상황표시 통합
    $('s-cue').style.display = 'none';                    // 설명 제거(유저: 정보 너무 많음)
    // 상황표시 = 데모 타이머 링(런지/하이니 미리보기와 동일 문법) — arc 진행 + 중앙 카운트다운 + 구간명 라벨
    const live = document.createElement('div'); live.id = 'train-live';
    live.innerHTML = `
      <div id="tp-ring">
        <svg viewBox="0 0 604 604">
          <circle cx="302" cy="302" r="275" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="6" stroke-dasharray="0.5 20.5" stroke-linecap="round"/>
          <circle id="tp-arc" cx="302" cy="302" r="275" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"
            transform="rotate(-90 302 302)" stroke-dasharray="1727.9" stroke-dashoffset="1727.9"/>
        </svg>
        <div id="tp-tip"><img src="assets/timer_tip.svg" alt=""></div>
        <div id="tp-num">—</div>
      </div>
      <div id="tp-phase">—</div>
      <div id="tp-cad">—</div>`;
    document.getElementById('board').appendChild(live);
    // 도트(전체 시간 프로그래스)를 클러스터 최상단으로 편입 — flex 세로 정렬(도트→링→구간명→SPM)
    const dots = $('s-dots');
    dots.style.position = 'static'; dots.style.transform = 'none'; dots.style.margin = '0 auto 26px';
    live.insertBefore(dots, live.firstChild);
  } else {
    $('s-cue').style.display = 'none';
  }
  const spm = params.get('spm');
  if (spm) { const el = document.createElement('div'); el.id = 'spm-lbl';
    el.innerHTML = `<b id="spm-me">--</b><span> / ${spm} SPM</span><div style="font-weight:500;font-size:44px;color:rgba(255,255,255,.62);margin-top:6px">내 발걸음 / 목표 — 소리에 맞춰</div>`; document.getElementById('board').appendChild(el); }
  // A2/A3 시범(3초) — 원본 실전직전 타이머 링(floor-timer.html) 소형 그대로 + DEMO 라벨.
  //   도트 로딩바는 시범 동안 숨김 → 3초 뒤 등장·채움 시작(따라하기 진행 전담).
  if (/^(A2|A3)$/.test(stage)) {
    const t = document.createElement('div'); t.id = 'demo-timer';
    t.innerHTML = `
      <svg viewBox="0 0 604 604">
        <circle cx="302" cy="302" r="275" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="6" stroke-dasharray="0.5 20.5" stroke-linecap="round"/>
        <circle class="arc" cx="302" cy="302" r="275" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" transform="rotate(-90 302 302)"/>
      </svg>
      <div class="tip"><img src="assets/timer_tip.svg" alt=""></div>
      <div class="dnum" id="demo-num">5</div>
      `;
    document.getElementById('board').appendChild(t);
    const nx = document.createElement('div'); nx.id = 'next-lbl'; nx.textContent = 'PREVIEW';
    document.getElementById('board').appendChild(nx);
    let n = 5;
    const iv = setInterval(() => { n--; if (n < 1) { clearInterval(iv); return; }
      document.getElementById('demo-num').textContent = n; }, 1000);
    // 도트바 = 시범 뒤부터
    const dots = $('s-dots'); dots.style.animationDelay = '5.15s';
    const clip = document.querySelector('.dclip'); if (clip) clip.style.animationDelay = '5.15s';
  }


  // 도트 로딩바 — 회색 10개 위 빨강 10개를 클립으로 드러냄. 클립 폭이 --dur 동안 0→100%.
  const gr = $('drow-g'), rr = $('drow-r');
  for (let i = 0; i < 10; i++) {
    const a = document.createElement('div'); a.className = 'dot g'; gr.appendChild(a);
    const b = document.createElement('div'); b.className = 'dot r'; rr.appendChild(b);
  }
  const dur = parseFloat(params.get('dur')) || 8;
  document.querySelector('.dclip').style.setProperty('--dur', dur + 's');
  </script>
</body></html>
