<!doctype html>
<!-- 농구 준비 대지 (1600×2670) — 러닝 시작 화면(floor.html)과 같은 레이아웃·같은 실측값. 콘텐츠만 농구.
     러닝 쪽을 고치면 이 파일도 같이 고쳐야 한다(문자열 12개 + 총량만 다름).
     원본 레이어(.bigglow · .foot)와 그 좌표는 그대로 두고, 그 위에 정보 레이어를 얹어 2단 화면으로 만든다.

     ■ 2상태 (Figma 2컷이 이걸 말한다)
       [정보] 헤더 + 링 + 3스탯 + Process 카드 + 버튼      0 ~ 2.6s
       [발]   Process 카드만 빠지고 그 자리에 글로우 + 발.  2.6s ~ ∞
              헤더 · 링 · 3스탯 · 버튼은 자리 그대로 남는다.
       .bigglow(top 1400 중심) · .foot(top 1140) 은 기존 검증 좌표 그대로 — Process 카드(1263~1755)와
       같은 자리라 교차가 그대로 성립한다. 위치를 옮기지 않았다.

     ■ 스케일 — Figma 는 360 폭 스펙. 이 파일의 기존 규칙 그대로 ×3.0 (기존 주석: "아바타 101→303",
       "절대 크기는 지면 타입스케일 유지(m 88) — 지면은 판이 물리적으로 커서 ×4.44 가 아니다").
       아래 모든 px 은 Figma 실측값 ×3. 주석의 (F:n) 이 Figma 원값이다. get_design_context 실측 노드:
       헤더 10:2191 · 3스탯 10:2207 · Process 10:2220 · 버튼 10:2241 · 링 10:2198

     ■ 3스탯에 뭘 넣었나 — Figma 초안은 Sport/Boxing · Joined/5602 · Recommended/Quiet On.
       Sport(서 있는 장소가 이미 말함) · Joined(팩 고르기 *전에* 볼 사회적 증거)를 버리고,
       Recommended 는 라벨만 Mode 로 고쳤다(이 화면에선 추천이 아니라 이미 켜진 설정).
       남긴 기준: ① 내 눈으로 확인 불가 ② 두 화면 전에 정한 값이라 틀릴 수 있음 ③ 다음 10초간 내 몸이 뭘 할지 바뀜
         Mode   웨어러블이 다리에 뭘 할지 — 유일하게 몸으로 미리 못 아는 값
         Goal   Process 그래프는 가이드 구간(스트레칭+학습)만 보여주고 RUN 은 'You Can Choose' 로 열려 있다 → 총량은 여기가 담당
         Injury 심각도 최고. 어느 드릴이 돌지를 이게 가른다. None 이 아니면 그 슬롯만 경고색(.warn) -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:'Supreme';src:url('../fonts/Supreme-Bold.woff2') format('woff2');font-weight:700;font-display:block}
@font-face{font-family:'Supreme';src:url('../fonts/Supreme-Medium.woff2') format('woff2');font-weight:500;font-display:block}
@font-face{font-family:'OffBit';src:url('../fonts/OffBitTrial-DotBold.woff2') format('woff2');font-weight:700;font-display:block}
@property --p{syntax:'<number>';inherits:false;initial-value:0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
#board{position:relative;width:1600px;height:2670px;background:transparent;overflow:hidden;
  font-family:'Supreme',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}

/* ══════════ [발 상태] 원본 레이어 — 좌표·크기 손대지 않음. 등장 시점만 2.75s 로, 루프는 무한으로. ══════════ */
/* 하단 큰 글로우 — 투명도는 선명히(0.85), 크기를 줄여 덜 튀게 + 숨쉬는 펄스·드리프트 */
.bigglow{position:absolute;left:50%;top:1400px;transform:translate(-50%,-50%);width:1020px;height:930px;
  opacity:0;animation:bloomIn .8s cubic-bezier(.2,.8,.25,1) 2.75s both}
.bigglow img{width:100%;height:100%;display:block;transform-origin:50% 46%;
  animation:glowLive 7s ease-in-out infinite 3.55s}
.foot{position:absolute;left:606px;top:1140px;width:400px;height:539px;
  opacity:0;animation:slideInUp .6s cubic-bezier(.2,.75,.2,1) 2.95s both}
.foot img{width:100%;height:100%;display:block;transform-origin:50% 100%;
  animation:footBob 5.5s cubic-bezier(.4,0,.3,1) infinite 3.55s}

/* ══════════ [정보 상태] ══════════
   콘텐츠 열 = F:360 → 1080, 가운데(left 260). 내부 인셋 F:16 → 48 (left 308, w 984). top = F:153.26/857.74 → 477 */

/* ── 헤더 (F 10:2191 · flex-col gap-8) ── */
.hdr{position:absolute;left:308px;top:477px;width:606px;              /* F:202 */
  opacity:0;animation:slideInLeft .55s cubic-bezier(.2,.75,.2,1) 0s both}
.who{display:flex;align-items:center;gap:12px}                        /* F:gap-4 */
.who img{width:72px;height:72px;border-radius:50%;object-fit:cover;display:block}  /* F:24 */
.who span{font-weight:700;font-size:48px;line-height:1.2;letter-spacing:-1.44px}   /* F:16/-0.48 */
.title{margin-top:24px;font-weight:700;font-size:103px;line-height:1.1;letter-spacing:-2.07px}
/* ↑ F:34.473/1.1/-0.6895. 2줄로 접힌다(min-w-full) — nowrap 아님. 글자별 루핑 웨이브는 아래 script. */
.title .ch{display:inline-block;will-change:transform,opacity;animation:charLoop 3s ease-in-out 3}
.title .sp{display:inline-block;width:.26em}
/* 글자를 span 으로 쪼개면 단어 안에서도 줄바꿈이 생긴다("Final 1 / km Pace" 사고) → 단어 단위로 감싸 묶는다 */
.title .w{display:inline-block;white-space:nowrap}

/* ── 웨어러블 배터리 링 (F 10:2198 · 85.42² @ 258.58,11.29) — 기기 정보는 이 하나뿐 ── */
.ring{position:absolute;left:1036px;top:511px;width:256px;height:256px;
  opacity:0;animation:fadeIn .5s ease .2s both}
.ring svg{width:100%;height:100%;display:block}
.ring .trk{fill:none;stroke:rgba(255,255,255,.22);stroke-width:7}
.ring .arc{fill:none;stroke:url(#ringGrad);stroke-width:7;stroke-linecap:round;
  stroke-dasharray:292.2;stroke-dashoffset:292.2;                     /* 2π·46.5 */
  animation:arcDraw .9s cubic-bezier(.2,.75,.2,1) .35s both}
/* icon_wearable.png = 빨간 웨어러블 글리프 정본(index.html 과 같은 에셋). F:41.23 → 124, 비율 유지. */
.ring img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:124px;height:124px;object-fit:contain;display:block}

/* ── 3스탯 (F 10:2207 · 360×44 @ y=148) ── */
.stats{position:absolute;left:260px;top:921px;width:1080px;height:132px;
  display:flex;align-items:center;justify-content:center;gap:12px}     /* F:gap-4 */
/* F 는 셀 93 고정이지만 값이 종목마다 길다('Pace+Boost' > 'Quiet On') — 고정폭이면 줄바꿈된다.
   타입 스펙은 F 그대로 두고 폭만 1/3 균등 분할해 한 줄을 보장한다. */
.st{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:18px;text-align:center}  /* F:gap-6 */
.st .lab{font-weight:500;font-size:39px;line-height:1.2;letter-spacing:-1.5px;opacity:.7}  /* F:13/-0.5/.7 */
.st .val{font-weight:700;font-size:54px;line-height:1.2;letter-spacing:-1.62px}            /* F:18/-0.54 */
/* Injury 가 None 이 아니면 그 슬롯만 경고색 — 슬롯을 없애지는 않는다(3칸 판이 흔들린다) */
.st.warn .lab{opacity:.85;color:#FEC389}
.st.warn .val{color:#FEC389}
.sep{width:3px;height:99px;flex:none;background:rgba(255,255,255,.22)} /* F:h-33 */

/* ── Process (F 10:2220 @ y=232, x=16 · flex-col gap-8) ── */
.pTitle{position:absolute;left:308px;top:1173px;font-weight:700;font-size:54px;line-height:1.2;
  letter-spacing:-1.62px;color:#FAFAFA}                               /* F:18/-0.54 · Neutral/50 */
.card{position:absolute;left:308px;top:1263px;width:984px;height:492px;   /* F:328×164 */
  background:#fff;border-radius:60px;padding:12px;overflow:hidden}        /* F:r20 · p4 */
.inner{position:relative;width:100%;height:468px}                        /* F:156 */
/* F 는 left(총량)가 right(바) 위에 겹친 absolute 오버레이다 — 나란히 두면 바가 카드 밖으로 잘린다. */
.bars{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px;
  border-radius:54px;overflow:hidden}                                    /* F:gap-2 · r18 */
.bar{flex:1 1 0;min-height:0;display:flex;flex-direction:column;justify-content:center;
  padding:30px;border-radius:36px}                                       /* F:p10 · r12 */
.bar .row{display:flex;align-items:center;justify-content:space-between;width:100%;
  color:#fff;letter-spacing:-1.5px;white-space:nowrap}
.bar .m{font-weight:500;font-size:45px;line-height:1.4}                  /* F:15/1.4 Regular */
.bar .k{font-weight:700;font-size:39px;line-height:1.2;opacity:.7}       /* F:13/1.2 Bold */
/* 바는 없다가 우→좌로 촤르륵. b1·b2 는 그라디언트 흐름까지 두 개를 함께 선언해야 한다 —
   .bar.b1 의 animation 이 .bar 의 animation 을 특정도로 덮어써서 clip-path 가 안 풀리는 사고가 났었다. */
.bar{clip-path:inset(0 0 0 100%)}
/* 그라디언트 각도·정지점은 F 실측 그대로. background-size 로 늘리면 정지점이 뭉개져 색이 달라진다 — 손대지 않는다.
   (‘그라디언트가 은은하게 움직인다’ = 발 상태의 .bigglow/glowLive. 여기 바가 아니다.) */
.bar.b1,.bar.b2{animation:graphReveal .6s cubic-bezier(.2,.75,.2,1) both}
.bar.b1{width:510px;background-image:linear-gradient(-90deg,#D1FEFF 0%,#FEC389 6.49%,#FE6E3C 16.831%,#FA3030 41.678%);
  animation-delay:.95s}
.bar.b2{width:630px;background-image:linear-gradient(90deg,#FA3030 58.322%,#FE6E3C 83.169%,#FEC389 93.51%,#D1FEFF 100%);
  animation-delay:1.1s}
.bar.b3{width:100%;background:#A3A3A3;                                   /* F:Neutral/400 */
  animation:graphReveal .6s cubic-bezier(.2,.75,.2,1) 1.25s both}
.tot{position:absolute;left:0;top:0;width:300px;height:468px;padding:30px;color:#050A0A;z-index:2}
.tot .big{font-family:'OffBit',monospace;font-weight:700;font-size:180px;line-height:1}  /* F:60 */
.tot .unit{font-weight:700;font-size:54px;line-height:1.2;letter-spacing:-1.62px;opacity:.6}

/* ── 버튼 (F 10:2241 · 래퍼 p16, btn bg #FA3030 solid · px20 py16 · r999) — 두 상태 공통 ── */
.cta{position:absolute;left:260px;top:1791px;width:1080px;padding:48px;
  opacity:0;animation:slideInUp .6s cubic-bezier(.2,.75,.2,1) 1.35s both}
.cta .btn{display:flex;align-items:center;justify-content:center;gap:12px;
  background:#FA3030;border-radius:999px;padding:48px 60px}
.cta .btn span{font-weight:700;font-size:54px;line-height:1.2;letter-spacing:-1.62px;color:#fff;white-space:nowrap}
.cta .btn img{width:60px;height:60px;display:block}                      /* F:20, stroke=white 원본 그대로 */

/* ═══ 애니메이션 ═══ */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInUp{from{opacity:0;transform:translateY(52px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:translateY(26px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes graphReveal{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
@keyframes arcDraw{from{stroke-dashoffset:292.2}to{stroke-dashoffset:var(--off,38)}}
@keyframes bloomIn{from{opacity:0;transform:translate(-50%,-50%) scale(.82)}
  to{opacity:.85;transform:translate(-50%,-50%) scale(1)}}
/* 정보 → 발. 이 화면의 유일한 전환. */
@keyframes cardOut{from{opacity:1;transform:scale(1);filter:blur(0)}
  to{opacity:0;transform:scale(.96);filter:blur(6px)}}
/* 타이틀 글자 웨이브(좌→우 루핑) */
@keyframes charLoop{0%,58%,100%{opacity:.85;transform:translateY(0)}12%{opacity:1;transform:translateY(-16px)}26%{opacity:1;transform:translateY(0)}}
/* 발 툭툭 — 복싱 벽(index.html footBob) 정본 타이밍: 5.5s · 34px (기존 3s·46px 에서 교체) */
@keyframes footBob{0%,70%,100%{transform:translateY(0)}10%{transform:translateY(34px)}
  20%{transform:translateY(6px)}32%{transform:translateY(31px)}44%{transform:translateY(0)}}
/* 글로우 숨쉬기 + 드리프트 */
@keyframes glowLive{0%,100%{transform:translate(0,0) scale(1);opacity:.85}50%{transform:translate(-16px,10px) scale(1.06);opacity:1}}

/* ── 등장 순서(촤라락) → 2.6s 정보 out ── */
.st{opacity:0;animation:popIn .45s ease-out both}
.st:nth-of-type(1){animation-delay:.45s}
.st:nth-of-type(2){animation-delay:.56s}
.st:nth-of-type(3){animation-delay:.67s}
.sep{opacity:0;animation:fadeIn .4s ease .6s both}
.pTitle{opacity:0;animation:slideInUp .6s cubic-bezier(.2,.75,.2,1) .6s both,
  cardOut .55s ease-in 2.6s forwards}
.card{opacity:0;animation:slideInUp .6s cubic-bezier(.2,.75,.2,1) .7s both,
  cardOut .55s ease-in 2.6s forwards}
</style></head><body>
  <div id="board">

    <!-- [발 상태] 원본 레이어 — 위치 그대로 -->
    <div class="bigglow"><img src="assets/fig/big_glow.svg" alt=""></div>
    <div class="foot"><img src="assets/run/foot.svg" alt=""></div>

    <!-- 헤더 -->
    <div class="hdr">
      <div class="who"><img src="assets/photos/cardbg-curry.png" alt=""><span>Curry</span></div>
      <div class="title" id="title">Curry's Handle Pack</div>
    </div>

    <!-- 웨어러블 배터리 링 (기기 정보 1개) -->
    <div class="ring">
      <svg viewBox="0 0 100 100">
        <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FA3030"/><stop offset="55%" stop-color="#FE6E3C"/>
          <stop offset="85%" stop-color="#FEC389"/><stop offset="100%" stop-color="#D1FEFF"/>
        </linearGradient></defs>
        <circle class="trk" cx="50" cy="50" r="46.5"/>
        <circle class="arc" id="arc" cx="50" cy="50" r="46.5" transform="rotate(-90 50 50)"/>
      </svg>
      <img src="assets/icon_wearable.png" alt="">
    </div>

    <!-- 3스탯 -->
    <div class="stats">
      <div class="st"><div class="lab">Mode</div><div class="val">Press On</div></div>
      <div class="sep"></div>
      <div class="st"><div class="lab">Goal</div><div class="val">Step-Back 3</div></div>
      <div class="sep"></div>
      <div class="st" id="stInj"><div class="lab">Injury</div><div class="val" id="inj">None</div></div>
    </div>

    <!-- Process -->
    <div class="pTitle">Process</div>
    <div class="card">
      <div class="inner">
        <div class="bars">
          <div class="bar b1"><div class="row"><span class="m">4min</span><span class="k">STRETCH</span></div></div>
          <div class="bar b2"><div class="row"><span class="m">11min</span><span class="k">LEARN</span></div></div>
          <div class="bar b3"><div class="row"><span class="m">You Can Choose</span><span class="k">SHOOT!</span></div></div>
        </div>
        <div class="tot"><div class="big" id="tot">0</div><div class="unit">min</div></div>
      </div>
    </div>

    <!-- 버튼 -->
    <div class="cta"><div class="btn">
      <span>Tap Your Foot Twice</span><img src="assets/arrow-sm-right.svg" alt="">
    </div></div>
  </div>

  <script>
  // 타이틀 글자 분해 → 루핑 웨이브(촤라라락). 좌→우 순차 delay.
  //   글자마다 span 이면 단어 중간에서도 줄바꿈된다 → 단어를 .w 로 감싸 그 안에 글자를 넣는다.
  (function(){
    const t=document.getElementById('title'), txt=t.textContent; t.textContent=''; let vis=0;
    txt.split(' ').forEach((word,wi)=>{
      if(wi){ const sp=document.createElement('span'); sp.className='sp'; t.appendChild(sp); }
      const w=document.createElement('span'); w.className='w';
      [...word].forEach(c=>{ const s=document.createElement('span');
        s.className='ch'; s.textContent=c; s.style.animationDelay=(vis*0.09)+'s'; vis++; w.appendChild(s); });
      t.appendChild(w);
    });
  })();

  // 배터리 아크 — 원주 2π·46.5 = 292.2. 남길 길이만큼 dashoffset.
  const BATTERY = 87;
  document.getElementById('arc').style.setProperty('--off', (292.2*(1-BATTERY/100)).toFixed(1));

  // 부상이 None 이 아니면 그 슬롯만 경고색
  if (document.getElementById('inj').textContent.trim() !== 'None')
    document.getElementById('stInj').classList.add('warn');

  // 총량 카운트업 (1.2s~1.9s) — 바 촤르륵과 겹쳐서 판이 한 번에 살아난다. 가이드 구간 합 = 4+11.
  (function(){
    const el=document.getElementById('tot'), end=15, dur=700;
    setTimeout(()=>{ const s=performance.now();
      const step=n=>{ const p=Math.min(1,(n-s)/dur);
        el.textContent=Math.round(end*(1-Math.pow(1-p,3)));           // easeOutCubic
        if(p<1) requestAnimationFrame(step); };
      requestAnimationFrame(step); }, 1200);
  })();
  </script>
</body></html>
