<!doctype html>
<!-- 농구 바닥 대지 (1600×1600 정사각) — 러닝 floor.html과 동일 규약·동일 파이프라인.
     배경 투명(빔은 검정 못 쏨 → 바닥 비침), 발광 요소만. 사각 경계는 4변 페더로 사다리꼴 풋프린트에 스밈. -->
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:transparent}
  #board{position:relative;width:1600px;height:1600px;background:transparent;overflow:hidden;
    font-family:'Noto Sans KR',-apple-system,sans-serif;color:#fff;
    text-shadow:0 0 24px rgba(0,0,0,.55);
    -webkit-mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),
      linear-gradient(to bottom,transparent,#000 6%,#000 90%,transparent);
    -webkit-mask-composite:source-in; mask-composite:intersect;}
  .glow{position:absolute;inset:40px;border-radius:90px;
    background:radial-gradient(115% 85% at 50% 100%, rgba(255,60,50,.30), rgba(255,90,60,.12) 45%, transparent 72%)}
  .nearline{position:absolute;left:12%;right:12%;bottom:110px;height:3px;
    background:linear-gradient(to right,transparent,rgba(255,120,90,.7) 25%,rgba(255,120,90,.7) 75%,transparent);
    filter:blur(1px)}
  .eyebrow{position:absolute;top:150px;left:0;right:0;text-align:center;
    font-size:44px;letter-spacing:.3em;color:#ff9a4d;font-weight:800;
    animation:fadeUp .6s ease-out both}
  .title{position:absolute;top:240px;left:0;right:0;text-align:center;
    font-size:104px;font-weight:800;line-height:1.06;animation:fadeUp .6s .1s ease-out both}
  .sub{position:absolute;top:390px;left:0;right:0;text-align:center;font-size:46px;color:#eef1f6;
    animation:fadeUp .6s .22s ease-out both}
  .cta{position:absolute;bottom:180px;left:50%;transform:translateX(-50%);
    width:920px;height:150px;border:6px solid #ff5a3c;border-radius:80px;
    background:rgba(255,90,60,.14);
    display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:800;
    animation:ctaPulse 1.6s ease-in-out infinite}
  @keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
  @keyframes ctaPulse{0%,100%{box-shadow:0 0 30px rgba(255,90,60,.4)}50%{box-shadow:0 0 70px rgba(255,110,70,.85)}}
</style></head><body>
  <div id="board">
    <div class="glow"></div>
    <div class="nearline"></div>
    <div class="eyebrow">CURRY · STEP-BACK 3</div>
    <div class="title">READY</div>
    <div class="sub">스텝백 3점 팩 · 준비되면 두 번 탭</div>
    <div class="cta">👣 두 번 탭 → 시작</div>
  </div>
</body></html>
