<!doctype html>
<!-- 농구 준비 대지 (1600×2670) — 러닝 첫 화면(floor.html) 이식 · 농구 콘텐츠. 배경 투명. 프리즘 없음.
     농구 풋프린트가 더 넓지만 균일스케일(폭 맞춤)이 자동 조정 — 캔버스는 러닝과 동일. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:'Supreme';src:url('../fonts/Supreme-Bold.woff2') format('woff2');font-weight:700;font-display:block}
@font-face{font-family:'Supreme';src:url('../fonts/Supreme-Medium.woff2') format('woff2');font-weight:500;font-display:block}
@property --p{syntax:'<number>';inherits:false;initial-value:0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
#board{position:relative;width:1600px;height:2670px;background:transparent;overflow:hidden;
  font-family:'Supreme',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}

/* 하단 큰 글로우 */
.bigglow{position:absolute;left:50%;top:1400px;transform:translate(-50%,-50%);width:1020px;height:930px;opacity:.85}
.bigglow img{width:100%;height:100%;display:block;transform-origin:50% 46%;animation:glowLive 7s ease-in-out 3}

/* 팩 대표 이미지 — 모바일 카드의 크리에이터 프로필(home/pyeongso 공통 자산) 원형 크롭.
   제목 위에 놓아 '누구의 팩인가'를 첫 줄에서 읽히게 한다(유저). 지름 168 = 모바일 38 × 4.44. */
.pack{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:168px;height:168px;
  border-radius:50%;overflow:hidden;background:rgba(255,255,255,.14);
  box-shadow:0 0 0 5px rgba(255,255,255,.35);
  opacity:0;animation:fadeUpCentered .8s cubic-bezier(.2,.75,.2,1) .12s both}
.pack img{width:100%;height:100%;object-fit:cover;display:block}

/* 타이틀 — 글자 하나하나 루핑 웨이브 */
.title{position:absolute;top:216px;left:0;right:0;text-align:center;white-space:nowrap;
  font-weight:700;font-size:120px;line-height:1.1;letter-spacing:-4px}
.title .ch{display:inline-block;will-change:transform,opacity;animation:charLoop 3s ease-in-out 3}
.title .sp{display:inline-block;width:.26em}

/* 메타 한 줄 — 모바일 홈 카드의 '팩 · 시간' 조판(home.html 원본)을 지면에도 통일 */
.meta{position:absolute;top:358px;left:0;right:0;text-align:center;white-space:nowrap;
  font-weight:400;font-size:46px;letter-spacing:1px;color:rgba(255,255,255,.55);
  opacity:0;animation:fadeUpCentered .8s cubic-bezier(.2,.75,.2,1) .25s both}

/* 3열 스트립 = 모바일 공통 컴포넌트 .stats-row (creator.css — pyeongso 등에서 공유) 이식.
   360px→1600px = ×4.44 (label 13→58 · value 18→80 · divider 1x33→4x147 · gap 4→18). */
.strip{position:absolute;top:472px;left:50%;transform:translateX(-50%);display:flex;align-items:center;
  justify-content:center;gap:18px;
  opacity:0;animation:fadeUpCentered .8s cubic-bezier(.2,.75,.2,1) .35s both}
.col{flex:1;text-align:center;color:#fff;padding:0 18px}
.col.side{width:400px}
.col .k{font-family:'Supreme',sans-serif;font-weight:400;font-size:58px;opacity:.7;
  letter-spacing:-2.2px;margin-bottom:27px}
.col .v{font-weight:700;font-size:80px;letter-spacing:-2.4px;white-space:nowrap}
.col .v.sm{font-size:66px}
.divider{width:4px;height:147px;background:rgba(255,255,255,.3);flex:none}

/* 디바이스 칩 — 모바일 setup.css 의 .chip-sel / .chip-row 정본을 그대로 이식.
   360px 뷰포트 → 1600px 대지 = ×4.44 스케일 (font 14→62 · padding 6/12→27/53 · gap 4→18).
   구 배터리 링 3개는 폐기(유저: 거슬림) — 원형이 투사면에서 타원으로 눌려 형태가 무너졌다. */
.chips{position:absolute;top:668px;left:50%;transform:translateX(-50%);display:flex;gap:18px;
  opacity:0;animation:fadeUpCentered .8s cubic-bezier(.2,.75,.2,1) .5s both}
.chip-sel{display:inline-flex;align-items:center;gap:18px;box-sizing:border-box;
  background:#fff;border:none;border-radius:355px;padding:27px 53px;
  font-family:'Supreme',sans-serif;font-weight:400;font-size:62px;line-height:1.4;
  letter-spacing:-1.9px;color:#525252;box-shadow:0 0 9px rgba(0,0,0,.12)}
/* 선택 상태 = 뉴턴 그라디언트(setup.css 정본과 동일 스톱) */
.chip-sel.sel{color:#fff;
  background:linear-gradient(180deg,#FA3030 48%,#FE6E3C 77.6%,#FEC389 100.5%,#D1FEFF 107.5%);
  box-shadow:0 15px 58px 10px rgba(0,0,0,.05),inset 0 0 26px 9px rgba(255,255,255,.6)}
.chip-sel img{height:46px;width:auto;display:block;filter:brightness(0)}
.chip-sel.sel img{filter:brightness(0) invert(1)}   /* 아이콘 원본이 흰색 — 흰 칩에선 검게, 그라디언트 칩에선 그대로 */

/* 중앙 하단 Tap-foot 히어로 */
.hero{position:absolute;left:50%;top:1057px;transform:translateX(-50%);width:1000px;text-align:center;
  opacity:0;animation:fadeUpCentered .9s cubic-bezier(.2,.75,.2,1) .7s both}
.hero .arrow{width:86px;height:86px;display:block;margin:0 auto 30px;animation:arrowBob 3s ease-in-out 3 1.5s}
.hero .a{font-weight:700;font-size:88px;line-height:1.05;letter-spacing:-5px}
.foot{position:absolute;left:606px;top:1140px;width:400px;height:539px;
  opacity:0;animation:slideInUp .9s cubic-bezier(.2,.75,.2,1) .7s both}
.foot img{width:100%;height:100%;display:block;transform-origin:50% 100%;
  animation:footBob 3s cubic-bezier(.4,0,.3,1) 3 1.5s}

/* ═══ 애니메이션 ═══ */
@keyframes slideInUp{from{opacity:0;transform:translateY(52px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUpCentered{from{opacity:0;transform:translateX(-50%) translateY(52px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes charLoop{0%,58%,100%{opacity:.5;transform:translateY(0)}12%{opacity:1;transform:translateY(-16px)}26%{opacity:1;transform:translateY(0)}}
@keyframes fillRing{from{--p:0}to{--p:var(--pct)}}
@keyframes footBob{0%,58%,100%{transform:translateY(0)}12%{transform:translateY(46px)}25%{transform:translateY(6px)}40%{transform:translateY(44px)}52%{transform:translateY(0)}}
@keyframes arrowBob{0%,58%,100%{transform:translateY(0)}12%{transform:translateY(14px)}25%{transform:translateY(0)}40%{transform:translateY(13px)}52%{transform:translateY(0)}}
@keyframes glowLive{0%,100%{transform:translate(0,0) scale(1);opacity:.85}50%{transform:translate(-16px,10px) scale(1.06);opacity:1}}
</style></head><body>
  <div id="board">
    <div class="bigglow"><img src="assets/fig/big_glow.svg" alt=""></div>

    <div class="pack"><img src="assets/photos/cardbg-curry.png" alt=""></div>

    <div class="title" id="title">Curry's Handle Pack</div>

    <div class="meta">Pro Pack · 23 min</div>

    <div class="strip">
      <div class="col side"><div class="k">Time</div><div class="v">23min</div></div>
      <div class="divider"></div>
      <div class="col side"><div class="k">Connection</div><div class="v">Good</div></div>
      <div class="divider"></div>
      <div class="col side"><div class="k">Mode</div><div class="v">Press On</div></div>
    </div>
    <!-- 디바이스 = 모바일 칩 컴포넌트(.chip-sel) — 연결된 기기는 sel(뉴턴 그라디언트) -->
    <div class="chips">
      <div class="chip-sel sel"><img src="assets/run/ic_glasses.png">90%</div>
      <div class="chip-sel"><img src="assets/run/ic_watch.png">30%</div>
      <div class="chip-sel"><img src="assets/run/ic_earbuds.png">60%</div>
    </div>

    <div class="hero">
      <img class="arrow" src="assets/run/arrow.svg" alt="">
      <div class="a">Tap your foot Twice</div>
    </div>
    <div class="foot"><img src="assets/run/foot.svg" alt=""></div>
  </div>
  <script>
  (function(){
    const t=document.getElementById('title'); const txt=t.textContent; t.textContent=''; let vis=0;
    [...txt].forEach(c=>{ const s=document.createElement('span');
      if(c===' '){ s.className='sp'; } else{ s.className='ch'; s.textContent=c; s.style.animationDelay=(vis*0.09)+'s'; vis++; }
      t.appendChild(s); });
  })();
  window.addEventListener('load', ()=>{
  });
  </script>
</body></html>
