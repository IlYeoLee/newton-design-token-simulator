<!doctype html>
<!-- 농구 준비 대지 (1600×2670) — 러닝 첫 화면(floor.html) 이식 · 농구 콘텐츠. 배경 투명. 프리즘 없음.
     농구 풋프린트가 더 넓지만 균일스케일(폭 맞춤)이 자동 조정 — 캔버스는 러닝과 동일. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:'Supreme';src:url('../fonts/Supreme-Bold.woff2') format('woff2');font-weight:700;font-display:block}
@font-face{font-family:'Supreme';src:url('../fonts/Supreme-Medium.woff2') format('woff2');font-weight:500;font-display:block}
@property --p{syntax:'<number>';inherits:false;initial-value:0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
#board{position:relative;width:1600px;height:2670px;background:transparent;overflow:hidden;
  font-family:'Supreme',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}

/* 하단 큰 글로우 */
.bigglow{position:absolute;left:50%;top:1400px;transform:translate(-50%,-50%);width:1020px;height:930px;opacity:.85}
.bigglow img{width:100%;height:100%;display:block;transform-origin:50% 46%;animation:glowLive 7s ease-in-out infinite}

/* 타이틀 — 글자 하나하나 루핑 웨이브 */
.title{position:absolute;top:176px;left:0;right:0;text-align:center;white-space:nowrap;
  font-weight:700;font-size:120px;line-height:1.1;letter-spacing:-4px}
.title .ch{display:inline-block;will-change:transform,opacity;animation:charLoop 3s ease-in-out infinite}
.title .sp{display:inline-block;width:.26em}

/* 3칸 정보 스트립 */
.strip{position:absolute;top:452px;left:50%;transform:translateX(-50%);height:142px;display:flex;align-items:center;
  opacity:0;animation:fadeUpCentered .8s cubic-bezier(.2,.75,.2,1) .35s both}
.col{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 40px;text-align:center}
.col.side{width:400px}
.col .k{font-weight:500;font-size:40px;color:rgba(255,255,255,.55);letter-spacing:-.5px;margin-bottom:14px}
.col .v{font-weight:700;font-size:64px;letter-spacing:-2px;white-space:nowrap}
.col .v.sm{font-size:52px}
.divider{width:2px;height:100px;background:rgba(255,255,255,.22);flex:none}

/* 디바이스 프로그래스 링 */
.devs{position:absolute;top:654px;left:50%;transform:translateX(-50%);display:flex;gap:28px;
  opacity:0;animation:fadeUpCentered .8s cubic-bezier(.2,.75,.2,1) .5s both}
.dev{position:relative;width:170px;height:170px}
.dev svg{position:absolute;inset:0;width:100%;height:100%}
.dev .track{fill:none;stroke:rgba(255,255,255,.16);stroke-width:13}
.dev .prog{fill:none;stroke:#fff;stroke-width:13;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:50% 50%;
  stroke-dasharray:477;stroke-dashoffset:477;transition:stroke-dashoffset 1.5s cubic-bezier(.3,.85,.3,1)}
.dev .ic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
.ic-glasses{width:96px}.ic-watch{width:56px}.ic-earbuds{width:82px}

/* 중앙 하단 Tap-foot 히어로 */
.hero{position:absolute;left:50%;top:1057px;transform:translateX(-50%);width:1000px;text-align:center;
  opacity:0;animation:fadeUpCentered .9s cubic-bezier(.2,.75,.2,1) .7s both}
.hero .arrow{width:86px;height:86px;display:block;margin:0 auto 30px;animation:arrowBob 3s ease-in-out infinite 1.5s}
.hero .a{font-weight:700;font-size:88px;line-height:1.05;letter-spacing:-5px}
.foot{position:absolute;left:606px;top:1140px;width:400px;height:539px;
  opacity:0;animation:slideInUp .9s cubic-bezier(.2,.75,.2,1) .7s both}
.foot img{width:100%;height:100%;display:block;transform-origin:50% 100%;
  animation:footBob 3s cubic-bezier(.4,0,.3,1) infinite 1.5s}

/* ═══ 애니메이션 ═══ */
@keyframes slideInUp{from{opacity:0;transform:translateY(52px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUpCentered{from{opacity:0;transform:translateX(-50%) translateY(52px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes charLoop{0%,58%,100%{opacity:.5;transform:translateY(0)}12%{opacity:1;transform:translateY(-16px)}26%{opacity:1;transform:translateY(0)}}
@keyframes fillRing{from{--p:0}to{--p:var(--pct)}}
@keyframes footBob{0%,58%,100%{transform:translateY(0)}12%{transform:translateY(46px)}25%{transform:translateY(6px)}40%{transform:translateY(44px)}52%{transform:translateY(0)}}
@keyframes arrowBob{0%,58%,100%{transform:translateY(0)}12%{transform:translateY(14px)}25%{transform:translateY(0)}40%{transform:translateY(13px)}52%{transform:translateY(0)}}
@keyframes glowLive{0%,100%{transform:translate(0,0) scale(1);opacity:.85}50%{transform:translate(-16px,10px) scale(1.06);opacity:1}}
</style></head><body>
  <div id="board">
    <div class="bigglow"><img src="assets/fig/big_glow.svg" alt=""></div>

    <div class="title" id="title">Curry's Step-Back Pack</div>

    <div class="strip">
      <div class="col side"><div class="k">Time</div><div class="v">30min</div></div>
      <div class="divider"></div>
      <div class="col mid"><div class="k">Connection</div><div class="v">Good</div></div>
      <div class="divider"></div>
      <div class="col side"><div class="k">Mode</div><div class="v">Press On</div></div>
    </div>

    <!-- 디바이스 프로그래스 링 3개 -->
    <div class="devs">
      <div class="dev">
        <svg viewBox="0 0 170 170"><circle class="track" cx="85" cy="85" r="76"/><circle class="prog" cx="85" cy="85" r="76" data-pct=".9"/></svg>
        <img class="ic ic-glasses" src="assets/run/ic_glasses.png">
      </div>
      <div class="dev">
        <svg viewBox="0 0 170 170"><circle class="track" cx="85" cy="85" r="76"/><circle class="prog" cx="85" cy="85" r="76" data-pct=".3"/></svg>
        <img class="ic ic-watch" src="assets/run/ic_watch.png">
      </div>
      <div class="dev">
        <svg viewBox="0 0 170 170"><circle class="track" cx="85" cy="85" r="76"/><circle class="prog" cx="85" cy="85" r="76" data-pct=".6"/></svg>
        <img class="ic ic-earbuds" src="assets/run/ic_earbuds.png">
      </div>
    </div>

    <div class="hero">
      <img class="arrow" src="assets/run/arrow.svg" alt="">
      <div class="a">Tap your foot Twice</div>
    </div>
    <div class="foot"><img src="assets/run/foot.svg" alt=""></div>
  </div>
  <script>
  (function(){
    const t=document.getElementById('title'); const txt=t.textContent; t.textContent=''; let vis=0;
    [...txt].forEach(c=>{ const s=document.createElement('span');
      if(c===' '){ s.className='sp'; } else{ s.className='ch'; s.textContent=c; s.style.animationDelay=(vis*0.09)+'s'; vis++; }
      t.appendChild(s); });
  })();
  window.addEventListener('load', ()=>{
    document.querySelectorAll('.dev .prog').forEach((p,i)=>{
      const pct=parseFloat(p.getAttribute('data-pct'))||0;
      setTimeout(()=>{ p.style.strokeDashoffset = 477*(1-pct); }, 900 + i*160);
    });
  });
  </script>
</body></html>
