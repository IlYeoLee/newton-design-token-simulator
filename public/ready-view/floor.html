<!doctype html>
<!-- 바닥 대지 플레이스홀더 — Figma 러닝/농구 대지(1600×2000)가 이 자리에 export되어 들어옴.
     바닥 규약: 배경 투명(빔프는 검정을 못 쏨 → 잔디 비침), 발광 요소(글자·테두리·글로우)만 투사. -->
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:transparent}
  #board{position:relative;width:1600px;height:2000px;background:transparent;overflow:hidden;
    font-family:'Noto Sans KR',-apple-system,sans-serif;color:#fff;
    text-shadow:0 0 24px rgba(0,0,0,.55)}   /* 잔디 위 가독 — 은은한 대비 글로우 */
  /* 투사 존을 은은히 인지시키는 발광 패널(검정 아님) — near 진홍→far 투명 */
  .glow{position:absolute;inset:60px;border-radius:60px;
    background:radial-gradient(120% 90% at 50% 100%, rgba(255,60,50,.28), rgba(255,90,60,.10) 45%, transparent 72%)}
  .eyebrow{position:absolute;top:150px;left:0;right:0;text-align:center;
    font-size:44px;letter-spacing:.3em;color:#ff9a4d;font-weight:800}
  .title{position:absolute;top:240px;left:0;right:0;text-align:center;
    font-size:104px;font-weight:800;line-height:1.06}
  .sub{position:absolute;top:430px;left:0;right:0;text-align:center;font-size:46px;color:#eef1f6}
  .cta{position:absolute;bottom:200px;left:50%;transform:translateX(-50%);
    width:920px;height:150px;border:6px solid #ff5a3c;border-radius:80px;
    background:rgba(255,90,60,.14);
    display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:800;
    animation:ctaPulse 1.6s ease-in-out infinite}
  /* ── CSS 모션 데모(라이브) — HTML 그대로 바닥에 투사·밟힘 검증. Figma export 시 교체 ── */
  .eyebrow,.title,.sub{animation:fadeUp .6s ease-out both}
  .title{animation-delay:.1s} .sub{animation-delay:.22s}
  @keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
  @keyframes ctaPulse{0%,100%{box-shadow:0 0 30px rgba(255,90,60,.4)}50%{box-shadow:0 0 70px rgba(255,110,70,.85)}}
</style></head><body>
  <div id="board">
    <div class="glow"></div>
    <div class="eyebrow">RUNNING · READY</div>
    <div class="title">준비 —<br>발 두 번 구르면 시작</div>
    <div class="sub">션의 마지막 1km 페이스로</div>
    <div class="cta">👣 발 두 번 구르기</div>
  </div>
</body></html>
