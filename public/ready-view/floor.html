<!doctype html>
<!-- 러닝 준비 대지 (1600×2000) — Figma "러닝 준비"(node 59:3582) 그대로 이식. 배경 투명(빔은 검정 못 쏨).
     가독성 개선판: 3칸 정보 스트립(Time/Connection/Mode) + 디바이스 3 + Tap 히어로. 정적 재현(정확도 체크용). -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:'Supreme';src:url('../fonts/Supreme-Bold.woff2') format('woff2');font-weight:700;font-display:block}
@font-face{font-family:'Supreme';src:url('../fonts/Supreme-Medium.woff2') format('woff2');font-weight:500;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
#board{position:relative;width:1600px;height:2000px;background:transparent;overflow:hidden;
  font-family:'Supreme',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}

/* 하단 큰 글로우 (Ellipse 31226) */
.bigglow{position:absolute;left:50%;top:1310px;transform:translate(-50%,-50%);width:1300px;height:1170px}
.bigglow img{width:100%;height:100%;display:block}

/* 타이틀 */
.title{position:absolute;top:200px;left:0;right:0;text-align:center;
  font-weight:700;font-size:100px;line-height:1;letter-spacing:-4px}

/* ── 3칸 정보 스트립 ── */
.strip{position:absolute;top:430px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:56px}
.col{display:flex;flex-direction:column;align-items:center;text-align:center}
.col .k{font-weight:500;font-size:40px;color:rgba(255,255,255,.55);letter-spacing:-.5px;margin-bottom:16px}
.col .v{font-weight:700;font-size:64px;letter-spacing:-2px;white-space:nowrap}
.col .v.sm{font-size:52px}
.divider{width:2px;height:100px;background:rgba(255,255,255,.22)}

/* ── 디바이스 3개 링 (Figma 합성 export) ── */
.devs{position:absolute;top:660px;left:50%;transform:translateX(-50%);width:585px;height:195px}
.devs img{width:100%;height:100%;display:block}

/* ── 중앙 하단: Tap-foot 히어로 ── */
.hero{position:absolute;left:50%;top:1044px;transform:translateX(-50%);width:900px;text-align:center}
.hero .arrow{width:86px;height:86px;display:block;margin:0 auto 30px}
.hero .a{font-weight:700;font-size:94px;line-height:1.05;letter-spacing:-6.7px}
.foot{position:absolute;left:50%;top:1270px;transform:translateX(-50%);width:300px;height:400px;opacity:.92;
  -webkit-mask-image:url('assets/fig/foot_mask.png');mask-image:url('assets/fig/foot_mask.png');
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-position:center;mask-position:center;
  background-image:linear-gradient(168.9deg,rgba(102,102,102,0) 19%,rgba(0,0,0,.2) 88%),
    linear-gradient(169.6deg,rgba(254,195,137,0) 37%,#fa3030 94%)}
.disc{position:absolute;left:50%;top:1575px;transform:translateX(-50%);width:370px;height:auto;display:block}
</style></head><body>
  <div id="board">
    <div class="bigglow"><img src="assets/fig/big_glow.svg" alt=""></div>

    <div class="title">Sean's Final 1km Pace</div>

    <!-- 3칸 정보 스트립 -->
    <div class="strip">
      <div class="col"><div class="k">Time</div><div class="v">30min</div></div>
      <div class="divider"></div>
      <div class="col"><div class="k">Connection</div><div class="v">Good</div></div>
      <div class="divider"></div>
      <div class="col"><div class="k">Mode</div><div class="v sm">Pace &amp; BoostOn</div></div>
    </div>

    <!-- 디바이스 링 3개 (Figma 합성 PNG) -->
    <div class="devs"><img src="assets/fig/devices.png" alt=""></div>

    <!-- Tap-foot 히어로 -->
    <div class="hero">
      <img class="arrow" src="assets/fig/arrow.svg" alt="">
      <div class="a">Tap your foot Twice</div>
    </div>
    <div class="foot"></div>
    <img class="disc" src="assets/footprint_shadow.svg" alt="">
  </div>
</body></html>
