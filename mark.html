<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>MARK 프리뷰 — Figma 합성 이식</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦶</text></svg>">
<style>
  @font-face{font-family:OffBitDot;src:url(/fonts/OffBitTrial-DotBold.woff2) format('woff2');font-display:block}
  :root{--bg:#0A0C10;--line:#1D222C;--text:#E9EAEE;--dim:#98A1AD;--sand:#FEC389}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.6 -apple-system,system-ui,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
  h1{font-size:16px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:12px;margin:0 0 16px}
  .stage{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
  .cell{background:#000;border-radius:12px;overflow:hidden;position:relative}
  .cell canvas,.cell img{width:100%;display:block}
  .cap{position:absolute;left:8px;top:6px;font-size:10.5px;color:var(--sand);text-shadow:0 1px 3px #000}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .btn{padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:none;color:var(--dim);
    font-size:12px;cursor:pointer;font-weight:600}
  .btn.on{border-color:var(--sand);color:var(--sand);background:rgba(254,195,137,.08)}
  .sliders{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:5px 26px}
  .sld{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--dim)}
  .sld label{width:92px;flex:none}
  .sld input{flex:1;accent-color:#FA3030}
  .sld i{width:46px;text-align:right;font-style:normal;font-variant-numeric:tabular-nums;color:var(--text)}
  .note{margin-top:14px;font-size:11.5px;color:var(--dim);line-height:1.75}
  .note b{color:var(--text)} code{color:var(--sand);font-size:11px}
</style>
</head><body><div class="wrap">
<h1>MARK 프리뷰 — Figma 합성 이식</h1>
<p class="sub">레이어 순서·좌표·회전·마스크·블렌드 전부 <code>get_design_context</code> 값 그대로.
닷 패턴은 별도 레이어가 아니라 <b>마스크 자체</b>입니다 — 아래 필이 점 사이로만 드러납니다.</p>

<div class="stage">
  <div class="cell"><span class="cap">① 닷 마스크 (패스5 × 패턴)</span><canvas id="m"></canvas></div>
  <div class="cell"><span class="cap">② 합성 결과</span><canvas id="c"></canvas></div>
  <div class="cell"><span class="cap">③ Figma 정답지</span><img id="ref" alt=""></div>
</div>

<div class="row" id="layers"></div>
<div class="sliders" id="sliders"></div>
<p class="note" id="note"></p>
</div>

<script type="module">
const F = await fetch('/marks/foot-right.json').then(r => r.json());
await document.fonts.load('80px OffBitDot');

const SS = 2, FR = 550;                       // 프레임 550×550 (Figma 노드 크기)
const P = { patScroll: 0, innerGlow: 34, glowBlur: 22, fillA: 80, num: 2, numSize: 80,
            rot: -172.14, mx: 190.17, my: 102.49 };
const ON = { glow: 1, fill: 1, inner: 1, mask: 1, num: 1, diff: 0 };
const refImg = new Image();

// ── 닷 패턴 타일 ─────────────────────────────────────────────────────────────
//   SVG defs 그대로: 타일 6×12 단위, 점 r 0.5 · 피치 2, 아래 절반(y≥6)은 x 를 1 어긋냄
//   (원본의 use translate(-3 6)/(3 6) 을 모듈로로 정리하면 정확히 이 형태가 된다)
const U = F.pat.unit, TW = F.pat.tile[0], TH = F.pat.tile[1];
const patCv = document.createElement('canvas');
patCv.width = Math.round(TW * SS); patCv.height = Math.round(TH * SS);
{
  const c = patCv.getContext('2d');
  c.scale(SS * U, SS * U);                     // 1 단위 = U px
  c.fillStyle = '#fff';
  for (let ty = 0; ty < 2; ty++) for (let iy = 0; iy < 3; iy++) for (let ix = -1; ix <= 3; ix++) {
    const x = (ty ? 1.5 : 0.5) + ix * 2, y = 0.5 + iy * 2 + ty * 6;
    for (const dx of [-6, 0, 6]) {             // 타일 경계에 걸친 점까지 그린다
      c.beginPath(); c.arc(x + dx, y, F.pat.r, 0, 6.2832); c.fill();
    }
  }
}
const patFill = patCv.getContext('2d') && document.createElement('canvas').getContext('2d').createPattern(patCv, 'repeat');

// ── ① 닷 마스크 — 발 패스 5개, 각자 자기 패턴 오프셋 ─────────────────────────
const MW = 189.706, MH = 363.153;             // 회색 발자국 실크기
const maskCv = document.getElementById('m');
maskCv.width = Math.round(MW * SS); maskCv.height = Math.round(MH * SS);
const maskCtx = maskCv.getContext('2d');
const [, , VW, VH] = F.viewBox;

function drawMask() {
  const c = maskCtx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, maskCv.width, maskCv.height);
  // ★ 배경은 반드시 투명 — destination-in 은 알파를 읽는다. 검정을 깔면 마스크가 통째로 무효.
  const k = MW / VW;                           // 패스 viewBox → 마스크 크기
  c.scale(SS * k, SS * k);
  F.paths.forEach((p, i) => {
    const [ox, oy] = F.patOff[i];
    c.save();
    c.clip(new Path2D(p.d));
    const pat = c.createPattern(patCv, 'repeat');
    const m = new DOMMatrix().translate(ox, oy + P.patScroll).scale(1 / SS, 1 / SS);
    pat.setTransform(m);
    c.fillStyle = pat;
    c.fillRect(-20, -20, VW + 40, VH + 40);
    c.restore();
  });
}

// ── ② 합성 ───────────────────────────────────────────────────────────────────
const cv = document.getElementById('c');
cv.width = cv.height = FR * SS;
const ctx = cv.getContext('2d');

const glowPath = new Path2D(F.glow.d);
const [, , GW, GH] = F.glow.viewBox;

function draw() {
  drawMask();
  const c = ctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, cv.width, cv.height);
  c.save(); c.scale(SS, SS);

  // ① 외곽 글로우 — 컨테이너 (177,75,196,399.66), 이미지는 inset −11.01% −22.45%
  //    = 블러가 번진 만큼 밖으로 나간다. 좌우반전(-scale-x-100).
  if (ON.glow) {
    const cw = 196, ch = 399.66, cx = 177, cy = 75;
    const bx = cx - 0.2245 * cw, by = cy - 0.1101 * ch;   // = (133, 31) · 크기 284×487.656
    c.save();
    c.translate(cx + cw / 2, 0); c.scale(-1, 1); c.translate(-(cx + cw / 2), 0);
    c.filter = `blur(${P.glowBlur * SS}px)`;   // filter 는 캔버스 픽셀 기준 → SS 반영
    c.translate(bx, by);
    c.fillStyle = '#fff';                      // Figma export 상 프리뷰 글로우는 흰색
    c.fill(glowPath);
    c.restore();
    c.filter = 'none';
  }

  // ② 회색 발자국 — 컨테이너 282.192×436.304 @(135.82,84.07)
  //    내부: Y플립 + 회전 −172.14° · 박스 228.4×408.903 · 마스크 @(38.131,18.421)
  if (ON.fill) {
    const CW = 282.192, CH = 436.304, CX = 135.82, CY = 84.07;
    const BW = 228.4, BH = 408.903;
    const box = document.createElement('canvas');
    box.width = Math.round(BW * SS); box.height = Math.round(BH * SS);
    const b = box.getContext('2d');
    b.scale(SS, SS);
    b.fillStyle = `rgba(255,255,255,${P.fillA / 100})`; b.fillRect(0, 0, BW, BH);
    b.fillStyle = 'rgba(0,0,0,0.01)'; b.fillRect(0, 0, BW, BH);
    if (ON.inner) {                            // inset 0 0 34px white
      b.save(); b.beginPath(); b.rect(0, 0, BW, BH); b.clip();
      b.beginPath();
      b.rect(-80, -80, BW + 160, BH + 160); b.rect(0, 0, BW, BH);
      b.fillStyle = '#fff'; b.shadowColor = '#fff'; b.shadowBlur = P.innerGlow;
      b.fill('evenodd'); b.restore();
    }
    b.strokeStyle = '#000'; b.lineWidth = 3.031;
    b.strokeRect(3.031 / 2, 3.031 / 2, BW - 3.031, BH - 3.031);
    // ★ 마스크는 회전하지 않는다. 회전하는 건 아래 사각 필뿐이고, 발 모양 마스크는
    //   프레임에 축 정렬로 얹힌다(회색 발자국 bbox = 189.706×363.153 @ 190.17,102.49).
    //   CSS 근사(mask-image 를 회전 div 안에 넣음)를 그대로 옮겼다가 각도가 안 맞았다.
    const fr = document.createElement('canvas');
    fr.width = fr.height = FR * SS;
    const f = fr.getContext('2d');
    f.save(); f.scale(SS, SS);
    f.translate(CX + CW / 2, CY + CH / 2);
    f.rotate(P.rot * Math.PI / 180);
    f.scale(1, -1);
    f.drawImage(box, -BW / 2, -BH / 2, BW, BH);
    f.restore();
    if (ON.mask) {
      f.globalCompositeOperation = 'destination-in';
      f.drawImage(maskCv, P.mx * SS, P.my * SS, MW * SS, MH * SS);
    }
    c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.drawImage(fr, 0, 0); c.restore();
  }

  // ③ 숫자 — OffBit Dot Bold 80px · #313131 · color-burn · 180° + Y플립
  if (ON.num) {
    c.save();
    c.globalCompositeOperation = 'color-burn';
    c.translate(261, 193);
    c.rotate(Math.PI); c.scale(1, -1);
    c.font = `${P.numSize}px OffBitDot`;
    c.fillStyle = '#313131';
    c.textBaseline = 'top';
    const w = c.measureText(String(P.num)).width;
    c.fillText(String(P.num), -w, 0);
    c.restore();
  }
  c.restore();
  // 정답지와 difference — 검게 수렴할수록 일치. 눈이 아니라 화면이 판정한다.
  if (ON.diff && refImg.complete) {
    c.save(); c.globalCompositeOperation = 'difference';
    c.drawImage(refImg, 0, 0, cv.width, cv.height); c.restore();
  }
}

// ── UI ───────────────────────────────────────────────────────────────────────
const lh = document.getElementById('layers');
for (const k of Object.keys(ON)) {
  const b = document.createElement('button');
  b.className = 'btn' + (ON[k] ? ' on' : ''); b.textContent = { glow: '외곽 글로우', fill: '필',
    inner: '이너 글로우', mask: '닷 마스크', num: '숫자', diff: '◐ 정답지 diff' }[k];
  b.onclick = () => { ON[k] = ON[k] ? 0 : 1; b.classList.toggle('on', !!ON[k]); draw(); };
  lh.appendChild(b);
}
const SL = [['rot', '회전 °', -180, 180, .01], ['mx', '마스크 X', -60, 120, .1],
  ['my', '마스크 Y', -60, 120, .1], ['patScroll', '패턴 스크롤', -40, 40, .5],
  ['innerGlow', '이너 글로우', 0, 120, 1], ['glowBlur', '외곽 블러 σ', 0, 60, 1],
  ['fillA', '필 불투명 %', 0, 100, 1], ['num', '숫자', 1, 9, 1], ['numSize', '숫자 크기', 20, 160, 1]];
const sh = document.getElementById('sliders');
for (const [k, label, lo, hi, st] of SL) {
  const d = document.createElement('div'); d.className = 'sld';
  d.innerHTML = `<label>${label}</label><input type=range min=${lo} max=${hi} step=${st} value=${P[k]}><i>${P[k]}</i>`;
  d.querySelector('input').oninput = e => { P[k] = +e.target.value;
    e.target.nextElementSibling.textContent = P[k]; draw(); };
  sh.appendChild(d);
}
// ── 계측기: 정답지와 평균 절대오차(0=완전일치). 눈으로 맞추지 않는다 ──────────
const SC = 275;
const refSm = document.createElement('canvas'); refSm.width = refSm.height = SC;
const ourSm = document.createElement('canvas'); ourSm.width = ourSm.height = SC;
let refPix = null;
window.score = () => {
  const keep = ON.diff; ON.diff = 0; draw(); ON.diff = keep;
  const o = ourSm.getContext('2d', { willReadFrequently: true });
  o.clearRect(0, 0, SC, SC); o.drawImage(cv, 0, 0, SC, SC);
  const a = o.getImageData(0, 0, SC, SC).data;
  let s = 0;
  for (let i = 0; i < a.length; i += 4)
    s += Math.abs(a[i] * a[i + 3] / 255 - refPix[i] * refPix[i + 3] / 255);
  return s / (SC * SC);
};
// 파라미터 하나를 스윕해 최소 오차 지점을 찾는다
window.sweep = (key, lo, hi, step) => {
  const orig = P[key]; let best = null;
  for (let v = lo; v <= hi; v += step) { P[key] = v; const s = window.score();
    if (!best || s < best.s) best = { v, s }; }
  P[key] = best.v; draw();
  return { key, ...best, was: orig };
};
refImg.onload = () => {
  const r = refSm.getContext('2d', { willReadFrequently: true });
  r.clearRect(0, 0, SC, SC); r.drawImage(refImg, 0, 0, SC, SC);
  refPix = r.getImageData(0, 0, SC, SC).data;
  draw();
};
refImg.src = document.getElementById('ref').src = '/marks/ref-preview.png';
draw();
document.getElementById('note').innerHTML =
  `프레임 <b>550×550</b> · 마스크 <b>${MW}×${MH}</b> · 패스 5개(각자 패턴 오프셋) ·
   회전 <b>−172.14°</b> + Y플립 · 마스크 오프셋 <b>38.131, 18.421</b> · 이너 <code>inset 0 0 34px white</code> ·
   숫자 <code>OffBit Dot Bold · #313131 · color-burn</code>.<br>
   <b>패턴 스크롤</b> 슬라이더를 밀면 점이 흐르고 그 자리의 색이 드러났다 덮입니다 — 구운 이미지로는 불가능한 축.`;
</script></body></html>
