<!doctype html>
<!-- 러닝·농구 운동중 지면 화면 (세로 1600×2670) — Figma 복싱 node 85-3995 세로 이식.
     타이틀(촤라락 글자 캐스케이드) + 원형 도트 프로그래스(복싱 scene.html 컴포넌트 재사용) + 하단 가로 페이즈 스트립.
     중앙은 콘텐츠 영역(발자국·가이드=WebGL 토큰)이라 비움(투명). ?stage=&dur= 로 주입. -->
<html lang="en"><head><meta charset="utf-8"><title>Newton — 운동중(지면)</title><style>
@font-face{font-family:'Supreme';src:url('../fonts/Supreme-Bold.woff2') format('woff2');font-weight:700;font-display:block}
@font-face{font-family:'Supreme';src:url('../fonts/Supreme-Medium.woff2') format('woff2');font-weight:500;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
#board{position:relative;width:1600px;height:2670px;overflow:hidden;
  font-family:'Supreme',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}

/* 콘텐츠 컬럼 = Figma 122:270/122:308 '콘텐츠 그룹'(flex 세로, gap 40, 중앙, top:280) 그대로 이식.
   타이틀·(큐)·프로그래스·프리뷰/훈련 행을 한 레이어에 세로로 쌓아 → 기울어진 보드 투사에서도 함께 정렬(안 밀림·안 겹침). */
#content{position:absolute;top:176px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:72px}   /* 타이틀·프로그래스·하단 간격 넉넉히(유저) */

/* 상단: 지시 타이틀(짧게) — 글자 하나하나 촤라락 슬라이드인 */
.title{text-align:center;white-space:nowrap;
  font-weight:700;font-size:120px;line-height:1.05;letter-spacing:-4px}
.title .ch{display:inline-block;animation:chIn .6s cubic-bezier(.2,.75,.2,1) both}
.title .sp{display:inline-block;width:.28em}
/* 타이틀 밑 짧은 지시 */
.cue{text-align:center;white-space:nowrap;
  font-weight:500;font-size:52px;color:rgba(255,255,255,.72);letter-spacing:-1px;
  opacity:0;animation:sUpFlat .6s .28s both}

/* 프로그래스 도트 로딩바(복싱 scene.html 규약) — 회색 위 빨강을 클립으로 좌→우 드러내며 --dur 동안 0→100% */
.dots{position:relative;height:60px;opacity:0;animation:sUpFlat .6s .42s both}
.drow{display:flex;height:60px}
.dot{width:60px;height:60px;border-radius:999px;flex:0 0 auto}
.dot.g{background:#d0d0d0}
.dot.r{background:#fa3030}
.dclip{position:absolute;left:0;top:0;height:60px;overflow:hidden;width:0;animation:dotsFill var(--dur,8s) linear both}
@keyframes dotsFill{from{width:0}to{width:600px}}

/* 하단: 페이즈 스트립(가로) — 현재 볼드+sub / 나머지 흐리게 */
.phases{position:absolute;top:2168px;left:0;right:0;display:flex;justify-content:center;align-items:baseline;gap:64px;
  opacity:0;animation:sUp .7s .5s both}
.phase{font-weight:500;font-size:46px;color:rgba(255,255,255,.4);letter-spacing:-1px;white-space:nowrap}
.phase.active{font-weight:700;font-size:58px;color:#fff;text-shadow:0 0 28px rgba(255,255,255,.4);
  animation:phasePulse 2.4s 1.4s ease-in-out infinite}

/* 지면에 눕힌 프레임 = 세로 translate가 원근상 '깊이 이동'(멀리서 날아옴)으로 보임 →
   등장은 제자리 스케일+페이드로(그 자리에서 자연스럽게 나타남). */
@keyframes chIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@keyframes sUp{from{opacity:0;transform:translateX(-50%) scale(.94)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes dotPad{}
@keyframes phasePulse{0%,100%{opacity:1}50%{opacity:.62}}
.phases{animation-name:sUpFlat}
@keyframes sUpFlat{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}

/* A 미리보기(프리뷰) — Figma 122:270 정확 이식: 타이틀 + [Preview 필(둥근 배경+화살표) · 타이머 링] 가로 행.
   링 = floor-timer(52-3084) 문법(점선 트랙+아크+회전 팁+중앙 숫자). 시범 5초, 끝나면 페이드아웃. */
@font-face{font-family:'OffBit';src:url('../fonts/OffBitTrial-DotBold.woff2') format('woff2');font-weight:700;font-display:block}
/* Figma 122:270 프리뷰 행 = 콘텐츠 컬럼의 자식(타이틀 바로 아래 gap 40). [Preview 필 · 타이머 링] 가로. */
#prev-row{display:flex;gap:120px;align-items:center;justify-content:center;
  opacity:0;animation:sUpFlat .5s .2s both, demoOutFlat .45s 5.05s both}
#prev-pill{display:flex;align-items:center;gap:20px;background:rgba(255,255,255,.14);border-radius:999px;padding:20px 30px 20px 40px}
#prev-pill .pv{font-family:'Supreme',sans-serif;font-weight:700;font-size:60px;color:#fff;white-space:nowrap;line-height:1}
#prev-pill svg{width:60px;height:60px;flex:0 0 auto}
#prev-ring{position:relative;width:200px;height:200px}   /* Figma 200×200 통일 */
#prev-ring svg.rg{position:absolute;inset:0;width:100%;height:100%}
#prev-ring .arc{stroke-dasharray:1727.9;stroke-dashoffset:1727.9;animation:arcFill 5s .15s linear both}
@keyframes arcFill{from{stroke-dashoffset:1727.9}to{stroke-dashoffset:0}}
#prev-ring .tip{position:absolute;inset:0;transform-origin:center;animation:tipSpin 5s .15s linear both}
#prev-ring .tip img{position:absolute;left:50%;top:-3px;width:28px;height:28px;transform:translateX(-50%);
  filter:drop-shadow(0 0 8px rgba(250,48,48,.6))}
@keyframes tipSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
#prev-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'OffBit','Supreme',sans-serif;font-size:96px;color:#fff;line-height:1}
#spm-lbl{position:absolute;top:300px;left:0;right:0;text-align:center;font-family:'Supreme',sans-serif;
  opacity:0;animation:sUpFlat .6s .4s both}
#spm-lbl b{font-weight:700;font-size:150px;letter-spacing:-4px;color:#fff;text-shadow:0 0 34px rgba(250,48,48,.45)}
#spm-lbl span{font-weight:500;font-size:56px;color:rgba(255,255,255,.72);margin-left:14px}
#next-lbl{position:absolute;top:104px;left:0;right:0;text-align:center;font-family:'Supreme',sans-serif;font-weight:700;font-size:54px;
  letter-spacing:8px;color:rgba(255,255,255,.8);opacity:0;
  animation:sUpFlat .5s .1s both, demoOutFlat .45s 5.05s both}
@keyframes demoOutFlat{to{opacity:0}}

/* 러닝 학습(P) — Figma 122-308 정확 이식(유저 배치): 타이틀=구간명 + 도트 프로그래스 + [내SPM/전문가SPM · 링] 가로 행.
   링(카운트다운) = 스트라이드·인터벌만. 이지런은 링 없이 SPM만. */
#train-row{display:flex;gap:110px;align-items:center;justify-content:center;
  opacity:0;animation:sUpFlat .6s .5s both}
/* 케이던스/페이스 컴포넌트(Figma 128-261): 숫자행 "150 / 150" + 아래 라벨(SPM/Pace). 실전·훈련 공용. */
.lstat{display:flex;flex-direction:column;align-items:center;gap:12px}
.lstat .lv{font-family:'Supreme',sans-serif;font-size:60px;line-height:1;white-space:nowrap;display:flex;gap:18px;align-items:baseline}
.lstat .lv b{font-weight:700;color:#fff}
.lstat .lv .d{font-weight:400;color:rgba(255,255,255,.6)}
.lstat .lbl{font-family:'Supreme',sans-serif;font-weight:400;font-size:40px;color:rgba(255,255,255,.6);letter-spacing:-1px}
/* 실전(Figma 128-261): 큰 km 카운터 + [SPM][Pace] 2열 */
#km{font-family:'OffBit','Supreme',sans-serif;font-weight:700;font-size:180px;color:#fff;line-height:1;white-space:nowrap}
#km .u{font-weight:400}
#live-row{display:flex;gap:120px;align-items:flex-start;justify-content:center}
#train-timer{position:relative;width:200px;height:200px;flex:0 0 auto}   /* Figma 200×200 통일 */
#train-timer svg{position:absolute;inset:0;width:100%;height:100%}
#train-timer #tp-arc{transition:stroke .35s}
#tp-tip{position:absolute;inset:0;transform-origin:center}
#tp-tip img{position:absolute;left:50%;top:-3px;width:28px;height:28px;transform:translateX(-50%);
  filter:drop-shadow(0 0 8px rgba(250,48,48,.6))}
#tp-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'OffBit','Supreme',sans-serif;font-size:96px;color:#fff;line-height:1}
</style></head><body>
  <div id="board">
    <div id="content">
      <div class="title" id="s-title">Title</div>
      <div class="cue" id="s-cue"></div>
      <div class="dots" id="s-dots">
        <div class="drow" id="drow-g"></div>
        <div class="dclip"><div class="drow" id="drow-r"></div></div>
      </div>
    </div>
  </div>
  <script src="floor-scenes.js"></script>
  <script>
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const stage = params.get('stage') || 'A1';
  const S = window.FLOOR_SCENES[stage] || { title: stage, phase: 0, sub: '' };
  const isP = /^P\d$/.test(stage);
  // 타이틀 — 비훈련: 글자 분해 촤라락 슬라이드인. 훈련(P): 구간명을 main.js가 라이브 갱신하므로 캐스케이드 생략.
  if (!isP) (function(){
    const t = $('s-title'); t.textContent = ''; let vis = 0;
    [...S.title].forEach(c => { const s = document.createElement('span');
      if (c === ' ') { s.className = 'sp'; }
      else { s.className = 'ch'; s.textContent = c; s.style.animationDelay = (0.1 + vis * 0.045) + 's'; vis++; }
      t.appendChild(s); });
  })();
  // 러닝 학습(P) — Figma 122-308 '운동 중' 정확 이식: 타이틀=구간명(라이브) + 도트 프로그래스 + 내SPM/전문가SPM.
  //   보조텍스트 없음. 카운트다운 링 = 스트라이드(P2)·인터벌(P3)만(이지런은 정해진 횟수 없음).
  if (isP) {
    // Figma 122-308 배치(유저): 타이틀(구간명) → 도트 프로그래스 → [내SPM/전문가SPM · 링] 가로 행.
    // 타이틀 Y는 전 지면 UI 공통 그리드(.title top:176) 유지 — 통일(유저: 규칙 없이 달랐음).
    $('s-cue').style.display = 'none';
    $('s-title').style.textTransform = 'capitalize';
    $('s-title').textContent = '';                     // main.js가 구간명으로 라이브 채움
    const hasRing = /^P[23]$/.test(stage);             // 링 = 스트라이드·인터벌만
    const row = document.createElement('div'); row.id = 'train-row';
    const ringHTML = hasRing ? `
        <div id="train-timer">
          <svg viewBox="0 0 604 604">
            <circle cx="302" cy="302" r="275" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="6" stroke-dasharray="0.5 20.5" stroke-linecap="round"/>
            <circle id="tp-arc" cx="302" cy="302" r="275" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"
              transform="rotate(-90 302 302)" stroke-dasharray="1727.9" stroke-dashoffset="1727.9"/>
          </svg>
          <div id="tp-tip"><img src="assets/timer_tip.svg" alt=""></div>
          <div id="tp-num">—</div>
        </div>` : '';
    // 케이던스 컴포넌트(Figma 128-261): "150 / 150" + 아래 SPM 라벨.
    row.innerHTML = `<div class="lstat"><div class="lv"><b id="spm-me">--</b><span class="d">/</span><span class="d" id="spm-tgt">--</span></div><div class="lbl">SPM</div></div>` + ringHTML;
    document.getElementById('content').appendChild(row);   // 컬럼: 타이틀 → 도트 → SPM/링
  } else {
    $('s-cue').style.display = 'none';
  }
  // 실전(C 라이브) — Figma 128:261: 큰 km 카운터(0→목표) + 도트 + [SPM][Pace] 2열. 타이틀 대신 km.
  if (/^C[2-5]$/.test(stage)) {
    $('s-title').style.display = 'none';
    const dots = $('s-dots');
    const km = document.createElement('div'); km.id = 'km';
    km.innerHTML = `<span id="km-n">0.00</span><span class="u">km</span>`;
    document.getElementById('content').insertBefore(km, dots);   // 컬럼 맨 위(타이틀 자리)
    const row = document.createElement('div'); row.id = 'live-row';
    row.innerHTML = `
      <div class="lstat"><div class="lv"><b id="spm-me">--</b><span class="d">/</span><span class="d" id="spm-tgt">--</span></div><div class="lbl">SPM</div></div>
      <div class="lstat"><div class="lv"><b id="pace-me">--</b><span class="d">/</span><span class="d" id="pace-tgt">--</span></div><div class="lbl">Pace</div></div>`;
    document.getElementById('content').appendChild(row);
  }
  const spm = params.get('spm');
  if (spm) { const el = document.createElement('div'); el.id = 'spm-lbl';
    el.innerHTML = `<b id="spm-me">--</b><span> / ${spm} SPM</span><div style="font-weight:500;font-size:44px;color:rgba(255,255,255,.62);margin-top:6px">내 발걸음 / 목표 — 소리에 맞춰</div>`; document.getElementById('board').appendChild(el); }
  // A2/A3 시범(3초) — 원본 실전직전 타이머 링(floor-timer.html) 소형 그대로 + DEMO 라벨.
  //   도트 로딩바는 시범 동안 숨김 → 3초 뒤 등장·채움 시작(따라하기 진행 전담).
  if (/^(A2|A3)$/.test(stage)) {
    // Figma 122:270 정확 이식 — 타이틀(#s-title) 아래 [Preview 필 + 타이머 링] 가로 행. 시범 5초 카운트다운.
    const row = document.createElement('div'); row.id = 'prev-row';
    row.innerHTML = `
      <div id="prev-pill">
        <span class="pv">Preview</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
      </div>
      <div id="prev-ring">
        <svg class="rg" viewBox="0 0 604 604">
          <circle cx="302" cy="302" r="275" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="6" stroke-dasharray="0.5 20.5" stroke-linecap="round"/>
          <circle class="arc" cx="302" cy="302" r="275" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" transform="rotate(-90 302 302)"/>
        </svg>
        <div class="tip"><img src="assets/timer_tip.svg" alt=""></div>
        <div id="prev-num">5</div>
      </div>`;
    // 컬럼: 타이틀 → 프리뷰 행(도트 슬롯 자리). 시범 동안 도트는 숨김(공간도 차지 X) → 5s 뒤 프리뷰 사라지고 도트가 그 자리로.
    const dots = $('s-dots');
    document.getElementById('content').insertBefore(row, dots);
    dots.style.display = 'none';
    let n = 5;
    const iv = setInterval(() => { n--; if (n < 1) { clearInterval(iv); return; }
      document.getElementById('prev-num').textContent = n; }, 1000);
    setTimeout(() => { row.style.display = 'none'; dots.style.display = ''; dots.style.animation = 'sUpFlat .6s both'; }, 5100);
    const clip = document.querySelector('.dclip'); if (clip) clip.style.animationDelay = '5.15s';
  }


  // 도트 로딩바 — 회색 10개 위 빨강 10개를 클립으로 드러냄. 클립 폭이 --dur 동안 0→100%.
  const gr = $('drow-g'), rr = $('drow-r');
  for (let i = 0; i < 10; i++) {
    const a = document.createElement('div'); a.className = 'dot g'; gr.appendChild(a);
    const b = document.createElement('div'); b.className = 'dot r'; rr.appendChild(b);
  }
  const dur = parseFloat(params.get('dur')) || 8;
  document.querySelector('.dclip').style.setProperty('--dur', dur + 's');
  </script>
</body></html>
