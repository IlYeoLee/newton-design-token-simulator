<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Newton 복싱 — 전환</title>
<style>
@font-face{font-family:'Supreme';src:url('../fonts/Supreme-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:block}
@font-face{font-family:'Supreme';src:url('../fonts/Supreme-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:block}
@font-face{font-family:'Supreme';src:url('../fonts/Supreme-Medium.woff2') format('woff2');font-weight:400;font-style:normal;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
.stage{position:relative;width:2600px;height:1600px;overflow:hidden;
  font-family:'Supreme',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
/* Figma 배경 그라디언트(Ellipse 31226, 블러 내장) — 은은하게 움직임.
   컨테이너 라디얼 마스크로 프레임 가장자리 전에 완전 투명 → 빔 투사 시 사각 모서리 원천 차단 */
.bg-glow{position:absolute;inset:0;overflow:hidden;pointer-events:none;
  -webkit-mask:radial-gradient(66% 62% at 50% 44%, #000 20%, transparent 90%);
          mask:radial-gradient(66% 62% at 50% 44%, #000 20%, transparent 90%)}
.bg-glow img{position:absolute;left:50%;top:50%;width:2050px;transform:translate(-50%,-50%);
  will-change:transform;animation:glowDrift 15s ease-in-out infinite}
@keyframes glowDrift{
  0%{transform:translate(-50%,-50%) scale(1) rotate(0deg)}
  25%{transform:translate(-59%,-44%) scale(1.14) rotate(5deg)}
  50%{transform:translate(-42%,-58%) scale(1.05) rotate(-4deg)}
  75%{transform:translate(-55%,-45%) scale(1.16) rotate(3deg)}
  100%{transform:translate(-50%,-50%) scale(1) rotate(0deg)}}

/* 타이틀 */
.tgrp{position:absolute;left:50%;transform:translateX(-50%);top:221px;width:1200px;
  display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.tsub{font-weight:400;font-size:48px;letter-spacing:-4.2px;color:rgba(255,255,255,.8)}
.ttl{font-weight:700;font-size:120px;letter-spacing:-4.8px;white-space:nowrap;line-height:1.05}

/* 카드 2장 */
.cards{position:absolute;left:50%;transform:translateX(-50%);top:532px;display:flex;gap:26.196px}
.card{position:relative;width:654.902px;height:654.902px;border-radius:65.49px;overflow:hidden;
  padding:52.392px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end}
.card .boxer{position:absolute;left:50%;transform:translateX(-50%);top:-55px;width:687px;height:auto;pointer-events:none}
/* 완료 카드 — 빨강 그라디언트 + 인물 plus-lighter + 흰 내부 글로우 */
.card.done{background:linear-gradient(180deg,#fa3030 47.99%,#fe6e3c 77.59%,#fec389 100.55%,#d1feff 107.53%);
  box-shadow:0 49.118px 190.969px 32.745px rgba(0,0,0,.05)}
.card.done .boxer{mix-blend-mode:plus-lighter}
.card.done::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 0 52.392px 19.647px rgba(255,255,255,.6)}
/* 다음 카드 — 흰 배경 + 인물 + 빨강→주황 오버레이 plus-lighter */
.card.next{background:#fff}
.card.next .tint{position:absolute;inset:0;background:linear-gradient(180deg,#fa3030,#fe6e3c);mix-blend-mode:plus-lighter;pointer-events:none}
.card .meta{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;gap:13.098px;align-items:flex-start}
.card .lbl{font-weight:700;font-size:64px;letter-spacing:-3.2745px;text-transform:uppercase;line-height:1.2}
.card.done .lbl{color:#fff}
.card.next .lbl{color:#3b3b3b}
.card .time{font-weight:400;font-size:36px;letter-spacing:-1.6373px}
.card.done .time{color:#fafafa}
.card.next .time{color:#757575}
/* 체크 뱃지 / Next 뱃지 */
.chk{position:relative;z-index:2;width:91.6px;height:91.6px}
.badge{position:relative;z-index:2;background:rgba(255,255,255,.9);border-radius:80px;padding:13.098px 26.196px;
  box-shadow:0 0 39.294px rgba(0,0,0,.12);display:flex;align-items:center}
.badge p{font-weight:500;font-size:52px;color:#525252;letter-spacing:-1.6px;line-height:1.2}

/* 버튼 */
.btn{position:absolute;left:50%;transform:translateX(-50%);top:1226px;width:802px;
  background:#fff;border-radius:999px;padding:42.614px 53.268px;display:flex;align-items:center;justify-content:center}
.btn p{font-weight:700;font-size:72px;color:#3b3b3b;letter-spacing:-1.33px;white-space:nowrap;line-height:1.2}

/* ── 공통 모션 ── */
@keyframes sUp{from{opacity:0;transform:translateY(48px)}to{opacity:1;transform:translateY(0)}}
@keyframes sUpC{from{opacity:0;transform:translate(-50%,54px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes sPop{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes cardIn{0%{opacity:0;transform:translateY(70px) scale(.92)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes titleIn{0%{opacity:0;transform:translate(-50%,44px) scale(.94)}70%{opacity:1;transform:translate(-50%,0) scale(1.02)}100%{transform:translate(-50%,0) scale(1)}}
@keyframes cardFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
@keyframes btnPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 60px 6px rgba(255,255,255,.35)}}
@keyframes btnFloatC{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-18px)}}
/* 타이틀 루프 웨이브 — 글자별 스태거로 촤라락 물결 */
.ttl span{display:inline-block}
@keyframes charWave{0%,58%,100%{transform:translateY(0)}29%{transform:translateY(-16px)}}
.tgrp{animation:titleIn .85s .10s cubic-bezier(.22,1,.36,1) both}
.card{opacity:0}
.card.a1{animation:cardIn .8s .38s cubic-bezier(.22,1,.36,1) both, cardFloat 4s 1.5s ease-in-out infinite}
.card.a2{animation:cardIn .8s .54s cubic-bezier(.22,1,.36,1) both, cardFloat 4.4s 1.85s ease-in-out infinite}
.chk{animation:sPop .6s .95s cubic-bezier(.34,1.56,.64,1) both}
.badge{animation:sPop .6s 1.0s cubic-bezier(.34,1.56,.64,1) both}
.btn{opacity:0;animation:sUpC .8s .95s cubic-bezier(.22,1,.36,1) both, btnFloatC 3.6s 1.9s ease-in-out infinite, btnPulse 3s 1.9s ease-in-out infinite}
</style>
</head>
<body>
<div class="stage">
 <div class="bg-glow"><img src="assets/bg_glow.svg" alt=""></div>
 <div class="tgrp"><div class="tsub" id="t-sub"></div><div class="ttl" id="t-ttl"></div></div>
 <div class="cards">
   <div class="card done a1" id="c-done">
     <img class="boxer" id="d-img" alt="">
     <svg class="chk" viewBox="0 0 92 92"><circle cx="46" cy="46" r="46" fill="rgba(255,255,255,.28)"/><path d="M27 47l13 13 25-28" fill="none" stroke="#fff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
     <div class="meta"><div class="lbl" id="d-lbl"></div><div class="time" id="d-time"></div></div>
   </div>
   <div class="card next a2" id="c-next">
     <img class="boxer" id="n-img" alt=""><div class="tint"></div>
     <div class="badge"><p id="n-badge">Next</p></div>
     <div class="meta"><div class="lbl" id="n-lbl"></div><div class="time" id="n-time"></div></div>
   </div>
 </div>
 <div class="btn"><p id="t-btn"></p></div>
</div>
<script>
const TR = {
  BX_T1: { sub:'Bring the Ring Home', title:'Stretch Done!',
    done:{lbl:'Stretch', time:'4m', img:'assets/boxer_stretch.png'},
    next:{lbl:'Learn', time:'8m', img:'assets/boxer_learn.png', badge:'Next'},
    btn:'Tap X2 For Retry!' },
  BX_T2: { sub:'Bring the Ring Home', title:'Learning complete!',
    done:{lbl:'Learn', time:'8m', img:'assets/boxer_learn.png'},
    next:{lbl:'Strike!', time:'23m', img:'assets/boxer_fight.png', badge:'Next'},
    btn:'Tap X2 For Retry!' },
};
const $ = id => document.getElementById(id);
const stage = new URLSearchParams(location.search).get('stage') || 'BX_T1';
const T = TR[stage] || TR.BX_T1;
$('t-sub').textContent = T.sub;
// 타이틀 글자별 span → 루프 웨이브(촤라락)
(function(el, t){ el.textContent=''; [...t].forEach((ch,i)=>{ const s=document.createElement('span');
  s.textContent = ch===' ' ? String.fromCharCode(160) : ch;
  s.style.animation = 'charWave 2.4s ' + (0.9 + i*0.05) + 's ease-in-out infinite'; el.appendChild(s); });
})($('t-ttl'), T.title);
$('d-img').src = T.done.img; $('d-lbl').textContent = T.done.lbl; $('d-time').textContent = T.done.time;
$('n-img').src = T.next.img; $('n-lbl').textContent = T.next.lbl; $('n-time').textContent = T.next.time;
$('n-badge').textContent = T.next.badge; $('t-btn').textContent = T.btn;
</script>
</body>
</html>
