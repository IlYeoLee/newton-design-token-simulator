<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>NEWTON 스탠스 랩 — 발 벌리기 토큰 · 띠 프레임 미리보기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>↔️</text></svg>">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,'Malgun Gothic',sans-serif}
  .wrap{padding:20px;display:flex;flex-direction:column;gap:12px;align-items:center}
  /* 프레임 = 유저 레퍼런스 비율. 화면 폭에 맞춰 줄되 비율은 절대 안 깨진다. */
  #frame{position:relative;width:min(1816px,calc(100vw - 40px));aspect-ratio:1816/510;
    background:#000 center/cover no-repeat;border:1px solid var(--line);overflow:hidden}
  #frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 14px;
    width:min(1816px,calc(100vw - 40px))}
  .bar > .t{color:var(--dim);font-size:11px;letter-spacing:.04em;flex:0 0 auto}
  .bar label{color:var(--dim);font-size:11.5px}
  .bar input[type=range]{accent-color:var(--red);width:130px;vertical-align:middle}
  .v{font-variant-numeric:tabular-nums;font-size:11.5px;min-width:52px;display:inline-block;text-align:right}
  button{background:#161A22;color:var(--text);border:1px solid var(--line);border-radius:8px;
    padding:5px 10px;font-size:11.5px;cursor:pointer}
  button.on{background:var(--red);border-color:var(--red);color:#fff}
  .note{color:var(--dim);font-size:11.5px;max-width:1000px;text-align:center}
  #verHint{color:#FEC389;font-size:11.5px;text-align:center}
  code{color:#FEC389}
</style>  <script type="module" crossorigin src="./assets/stancelab-_gp9zYJ_.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="./assets/fx-core-CgxR2OaG.js">
  <link rel="modulepreload" crossorigin href="./assets/fxlut-DQdnSjAt.js">
  <link rel="modulepreload" crossorigin href="./assets/tokens-kFgrQf-3.js">
  <link rel="modulepreload" crossorigin href="./assets/floorgl-DtFxW7BJ.js">
  <link rel="modulepreload" crossorigin href="./assets/session-BuPGUsrJ.js">
  <link rel="modulepreload" crossorigin href="./assets/mark-versions-4opYANT4.js">
  <link rel="stylesheet" crossorigin href="./assets/lab-skin-CHLkM1GD.css">
</head><body>
<div class=wrap>
  <div id=frame></div>

  <div class=bar>
    <span class=t>모션</span>
    <button id=play class=on>⏸</button>
    <label>t <input type=range id=s-t min=0 max=6 step=0.02 value=0><span class=v id=v-t>0.00s</span></label>
    <label>pitch <input type=range id=s-p min=-75 max=-30 step=0.5 value=-55><span class=v id=v-p>-55°</span></label>
    <label>발 길이 <input type=range id=s-len min=18 max=70 step=1 value=30><span class=v id=v-len>30cm</span></label>
  </div>

  <div class=bar>
    <span class=t>상태</span>
    <div id=segState></div>
  </div>

  <div class=bar>
    <span class=t>룩 후보</span>
    <div id=segVer></div>
  </div>
  <div id=verHint></div>

  <div class=bar>
    <span class=t>Success 후보</span>
    <div id=segSucc></div>
    <button id=succSave>이 안을 정본에 적용 (전 토큰)</button>
  </div>
  <div id=succHint></div>

  <div class=bar>
    <span class=t>무대</span>
    <button id=bgmode>배경: 뒷판</button>
    <label>배경 1장 <input type=range id=s-bg min=0.6 max=8 step=0.1 value=3.2><span class=v id=v-bg>3.2m</span></label>
    <button id=grid>각도 그리드</button>
    <button id=mgrid>30cm 격자</button>
    <button id=blend>블렌딩: 잉크</button>
    <label>각인(전 상태) <input type=range id=s-imp min=0 max=1 step=0.01 value=0.98><span class=v id=v-imp>0.98</span></label>
    <label>압력장 <input type=range id=s-pl min=0 max=1 step=0.01 value=0.55><span class=v id=v-pl>0.55</span></label>
    <label>화살표 온도 <input type=range id=s-heat min=0 max=1 step=0.01 value=0.15><span class=v id=v-heat>0.15</span></label>
  </div>

  <p class=note>프레임 1816×510(3.561:1) = 16:9·vfov 60°의 중앙 띠. 카메라는 실측 눈(y 1.69 · z −1.809),
  토큰은 시뮬 정본(<code>FootMark</code>·<code>floorArrow</code>), 모션 곡선은 <code>bkB1SetupPose</code>,
  룩 후보는 <code>src/mark-versions.js</code> — 전부 footlab·시뮬과 같은 파일이다.<br>
  <b>발 길이 정본은 30cm</b>(<code>FOOT_LEN_M</code>). 슬라이더는 미리보기 배율일 뿐이라, 정하고 나면 그 값을 정본에 박아야 한다.</p>
</div></body></html>
